pre-commit:
  parallel: true
  commands:
    # Next.js (apps/web)
    web-format:
      root: apps/web
      run: bun run format:check
    web-lint:
      root: apps/web
      env:
        SKIP_ENV_VALIDATION: '1'
      run: bun run lint
    web-typecheck:
      root: apps/web
      env:
        SKIP_ENV_VALIDATION: '1'
      run: bun run type-check

    # fpp-server (apps/server)
    server-format:
      root: apps/server
      run: bun run format:check
    server-lint:
      root: apps/server
      run: bun run lint
    server-typecheck:
      root: apps/server
      run: bun run type-check

    # fpp-analytics
    fpp-analytics-format:
      root: fpp-analytics
      run: uv run ruff format --check
    fpp-analytics-lint:
      root: fpp-analytics
      run: uv run ruff check
    fpp-analytics-typecheck:
      root: fpp-analytics
      run: uv run mypy .

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
