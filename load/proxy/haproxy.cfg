# The proxy in front of the API in the load stack, as Traefik is in front of it in production: it routes by health, so a
# container that drains (/api/health answers 503) stops getting upgrades and the new one takes them. `api-next` is a backup
# server: it gets traffic only when `api` is down, and exists only in the handoff run. HAProxy and not Caddy because a held
# WebSocket costs it two 16 KB buffers; Caddy's copy buffers needed more than the 128 MiB this container may have at 5,000 sockets.
global
    maxconn 20000

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s
    hold nx 1s
    hold other 1s

defaults
    mode http
    timeout connect 3s
    # The server pings every 25 s and closes a socket silent for 60 s, so these never end a live socket.
    timeout client 120s
    timeout server 120s
    timeout tunnel 1h
    retries 3
    option redispatch

frontend rooms
    bind :8080
    default_backend api

backend api
    option httpchk
    # HTTP/1.1 with a Host: the API answers 500 to a request with none (Bun hands the handler a relative URL).
    http-check send meth GET uri /api/health ver HTTP/1.1 hdr Host api
    http-check expect status 200
    # Two failed checks in a row take a server out (a 503 from a draining container answers at once, so a drain is seen in
    # about 2 s); a slow answer from a busy API does not.
    timeout check 3s
    default-server check inter 1s fall 2 rise 1 resolvers docker init-addr none
    server api api:7740
    server api-next api-next:7740 backup
