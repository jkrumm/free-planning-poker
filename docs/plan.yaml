  - key: v9-site-landing
    title: 'The landing page: a live table as the hero with three ways in, the five claims, a bento grid of live tiles, how a round works, open source, and the questions'
    kind: feature
    prio: 1
    seat: {tier: opus, effort: high}
    lane: browser
    after: [v9-site-look, v9-site-schema, v9-table-pick]
    after_needs: shipped
    facts:
      why: |-
        docs/v9/UX.md section The marketing site (the landing page's six blocks), section Position (the five claims, each with the fact that keeps it) and section Being found (every word in the HTML); the lab budget of docs/v9/ARCHITECTURE.md section Testing, row Budgets (LCP at most 2.0 s, no JavaScript but the analytics script before an island is visible). docs/v9/ARCHITECTURE.md sections Repo map (apps/site may import @fpp/table, @fpp/room-core and @fpp/telemetry, nothing else), Client (the storage key recent) and Measurement (landing_cta). An opus seat because this page is the product's first impression, and its composition, copy and loading order must hold together.
      what: |-
        apps/site/src/pages/index.astro, apps/site/src/components/landing (blocks and islands), the page's strings in one file, the landing tests (Playwright, under e2e/site or apps/site/test), the Lighthouse step of the job site.
      change: |-
        1. Hero: a live table played by scripted participants, @fpp/table on @fpp/room-core/sim with a fixed seed and bots, one island that loads when visible, with its static frame in the HTML at the same size so nothing shifts. With reduced motion the play stops on a settled state.
        2. Three ways in beside it, all in the HTML. Start planning: a link to /room/new. Join a room: one field that takes a link (its fragment kept), a six-digit number or a name (3 to 30 of a-z, 0-9 and the hyphen with at least one letter, ARCHITECTURE.md section Room model) and opens /room/<slug>; a wrong input says what to type (UX.md section Copy). Back to ...: on a device that has been here, the top three of localStorage fpp:v9:recent (address, display name, creation time, the code of a locked room, pinned; a schema version inside the value), in the order the room's own list uses, each link carrying a code percent-encoded with encodeURIComponent in its fragment. The site may not import @fpp/room-client, so a small parser here reads the value, shows nothing for an unknown version, and is tested against a value written by the room client's own code. Without JavaScript the block shows a link to /room.
        3. The five claims of UX.md section Position, each with its fact, as text.
        4. The bento grid, every tile the product's own components on the simulator, each an island on visibility, none a video or a screenshot: the reveal turning into the spread; a hand of each deck; a table growing from 3 to 30 seats; the insights of a seeded room (basalt-ui's charts over figures computed from a seeded run, because apps/site cannot import apps/room); a locked room's invite; the room inside a ticket. Each tile has its sentence in the HTML.
        5. How a round works in four steps (UX.md section Flows); open source and self-hosting (the licence, the repository, the one compose file, a link to /self-hosting); the questions through v9-site-schema's component.
        6. Blocks: basalt-ui's marketing blocks (Issue 2532: hero, bento grid, feature tile, call-to-action band, question list) if the installed release ships them; else build them in apps/site behind a named seam with the Issue number in a comment, as ENGINEERING.md section Working with basalt-ui allows.
        7. Every visible string of the page in one file, so v9-site-landing-i18n can translate it; the islands' own strings come from the room's message catalogue.
        8. landing_cta through the track facade of @fpp/telemetry, with the way in (start, join or back) as its one property; no slug or code in event data.
        9. Loading order: the hero's frame and the claims first; no island's script before its element is visible. Write the order in the pull request.
      acceptance: |-
        - Lighthouse in CI's lab conditions on the beta build: LCP at most 2.0 s and CLS at most 0.1 (the hero's static frame is the largest paint, not the island); the numbers are in the pull request.
        - A Playwright test counts requests: at first paint at 1280 by 800 no island script but the hero's has loaded, and scrolling a tile into view loads its script.
        - With JavaScript off, every heading and claim is in the page, the three ways in are present, and Start planning opens /room/new.
        - With reduced motion the hero shows a settled table and runs no animation (a test).
        - Join tests: a link with a fragment, a number and a name each open the right path; a wrong input shows the message.
        - Back to tests: a fixture value shows its top three with codes in the fragment; an unknown schema version shows none.
        - A test: one landing_cta per click with its way, through the facade.
        - make check passes.
      scope: |-
        No translation (v9-site-landing-i18n). No Umami script tag (v9-umami-events). No change in packages/table, packages/room-core or apps/room: a missing export is an Issue for that package's row.

