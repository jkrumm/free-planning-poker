  - key: v9-room-pwa
    title: 'The room as an installable app: the manifest, a service worker scoped to /room that precaches the shell and queues nothing, updates offered between rounds, the install offer, offline recent rooms'
    kind: feature
    prio: 1
    seat: {role: lead}
    lane: ui
    after: [v9-room-home]
    after_needs: shipped
    facts:
      why: |-
        A team that meets every day opens the room from its home screen. Behaviour: docs/v9/UX.md section Phone, install, embed (Install: the offer in the room's menu and once as a quiet hint on the second visit; from the home screen it opens /room with the recent rooms in its own window; offline it shows the shell and the recent rooms and says so; it never queues a vote; a new version is offered between rounds, never during one). Contract: docs/v9/ARCHITECTURE.md invariant 1 and 10, section Client (paragraph PWA: the worker at /_room/sw.js with Service-Worker-Allowed: /room, registered with scope /room, so marketing pages are never intercepted; it queues nothing, because a vote sent after a reveal is wrong; close code 4001 forces the update path), section Stack (vite-plugin-pwa, precache and update prompt only). Research: docs/v9/research/r04-spa-stack.md section PWA in 2026 (Background Sync is Chromium-only; a home screen app on iOS keeps its storage apart from Safari).
      what: |-
        apps/room (the plugin in the Vite configuration, the manifest, icons), apps/room/src/features/pwa/ with its registration line and message file, apps/api/src/http (serving /_room/sw.js with its headers), end-to-end and component tests.
      change: |-
        1. vite-plugin-pwa, pinned exactly, version checked with agw web package npm vite-plugin-pwa. Precache the shell and the hashed assets under /_room/; no runtime caching of /api, no Background Sync, no queue of any kind.
        2. The API serves /_room/sw.js with Service-Worker-Allowed: /room and Cache-Control: no-cache; the app registers it with scope /room.
        3. The manifest: start_url /room, scope /room, display standalone, colours from basalt-ui's tokens, icons from v1's set as a start (git show origin/v1:apps/web/public/web-app-manifest-192x192.png and the 512 one). Decide whether its name is translated and record it.
        4. Updates: a new worker waits. The room offers the update only between rounds: decide what counts (for example, no round in voting holds a vote) and record it; never during a round. The status reload-required (close 4001) takes the update path at once: activate the waiting worker and reload.
        5. Installing: where beforeinstallprompt exists, an 'Install app' item in the header's menu slot, and once a quiet hint on the second visit (the second visit read from recent; the dismissal kept in prefs, checked against invariant 10 and recorded). Where no prompt exists (iOS), the menu item explains how to add the app to the home screen. Event pwa_installed on appinstalled.
        6. Offline: /room shows the recent rooms from storage with a sentence that the device is offline and rooms open when it is back; a room page shows its shell and that sentence. A vote while offline is refused with a message and is not sent later.
        7. Conventions of every room row: the code lives in one feature directory, apps/room/src/features/pwa/, plus its one registration line in apps/room/src/features/index.ts and its message file; nothing else in a shared file changes, except the worker route in apps/api (step 2) and the Vite configuration (step 1). Every visible string, accessible names and placeholders included, comes from the message catalogue, with English and German complete in this pull request (Spanish, French and Simplified Chinese fall back to English until v9-room-translations). The test ids of e2e/TESTIDS.md stay; new ones are added to that file. The pull request extends the end-to-end suite and the component tests for what it adds and attaches the screenshots make ui-shots writes for the states it touched. basalt-ui components and tokens only: a missing piece is filed with factory issue new --repo basalt-ui and named in the pull request, never patched here; basalt-ui's design reviewer runs before review is asked for. The table is @fpp/table, mounted through apps/room/src/table-entry.ts; this row never reaches into it.
      acceptance: |-
        - An end-to-end test: after visiting /room/<slug>, the registration's scope is the origin plus /room, pages under /room are controlled, and a marketing path (/ and /guide, served by a stub in the test) is never controlled.
        - An end-to-end test with the context offline: /room shows the recent rooms and the offline sentence; a vote is refused, and after going online no vote frame is sent for it.
        - A component test with a fake registration: a waiting update during a round in voting shows no offer; after the reveal it shows one; reload-required activates and reloads.
        - A test: /_room/sw.js answers with Service-Worker-Allowed: /room and Cache-Control: no-cache.
        - The room entry's gzip size before and after is in the pull request and stays at most 180 kB.
        - make ui-shots STATES='pwa*' writes the install item, the hint, the update offer and the offline list at 360 and 1280 px, light and dark.
        - make check passes.
      scope: |-
        No push notifications, no Background Sync, no stored room snapshot. The site's own pages are stage 3's and are never in the worker's scope.

  - key: v9-room-embed
    title: 'The embedded room: ?embed=1 without site chrome down to a side panel, the versioned postMessage protocol with origin checks, frame-ancestors per variant, the snippet to copy and a test host page'
    kind: feature
    prio: 1
    seat: {role: lead}
    lane: ui
    after: [v9-room-shell]
    after_needs: shipped
    facts:
      why: |-
        The embedded room is the surface every later host shell builds on: the Jira Forge app, a Teams tab, Zoom, Meet and a Trello Power-Up each frame this route and speak this message protocol, so it is versioned and its result messages carry the one result contract from 9.0.0 on. Behaviour: docs/v9/UX.md section Phone, install, embed (Embed). Contract: docs/v9/ARCHITECTURE.md section Client (paragraph Embed and its message table), section Built for what comes next (the result contract, the embedding row), invariants 5 and 15. Research: docs/v9/research/r17-integrations-embed-webhooks.md sections 5 and 7 (storage in a frame is partitioned by the embedding site, and Safari empties it between launches) and r04-spa-stack.md section Embedding the app in other tools (frame-ancestors is ignored in a meta tag and does not fall back to default-src; Teams needs teams.microsoft.com, *.teams.microsoft.com and https://*.cloud.microsoft).
      what: |-
        apps/room/src/features/embed/ with its registration line and message file; apps/api/src/http (the Content-Security-Policy header on the room's responses); e2e/embed-host (a test host page) and end-to-end tests; docs/v9/embed.md (the message reference for host authors).
      change: |-
        1. /room/<slug>?embed=1 renders without site chrome (no switcher, no install offer) and follows the frame's width through the shell's container queries down to a narrow side panel (decide the narrowest width and record it); hello carries embed.
        2. The envelope { fpp: 1, type, id, payload }. Host to room: init (display name, theme, locale, and the password if the host keeps it), topics.set and topics.add (titles, links, tracker references; decide what topics.set replaces and record it). Room to host: ready (protocol version and capabilities), poker.revealed and topic.decided (exactly the objects the builders of packages/room-core return, invariant 15), resize (the height the room wants, from a ResizeObserver, throttled).
        3. Origins. Any https page may frame the embed variant (docs/v9/UX.md section Phone, install, embed: any page can frame a room; the owner's comment of 2026-11-19 that it must be easy to embed anywhere). The room talks only to the page that frames it: a message counts only if its source is window.parent; the first valid init fixes the host's origin, and from then on only that origin is heard and every reply names it as targetOrigin, never '*'. Unknown types and malformed envelopes are ignored without an error record. No message carries a seat secret, a hidden vote or a display name.
        4. The API sends Content-Security-Policy: frame-ancestors https: on the room's responses for ?embed=1 and frame-ancestors 'none' on every other room response, so the direct room can never be framed. One environment variable parsed in apps/api's env.ts replaces the embed variant's value: for a self-hoster who wants to name the hosts, and for the tests, which run on http. The header cannot be set in a meta tag and does not fall back to default-src (r04). docs/v9/embed.md says what a host page must do and that Teams, Jira, Trello, Zoom and Meet need nothing listed on our side.
        5. The name from init fills the name field and joins; a person whose frame lost its seat secret gets the seat back by its name (section Room model, A lost seat is taken back by name). The password field works inside the frame.
        6. A settings section shows the snippet to copy: an iframe with the room's URL and ?embed=1, a title attribute, allow="clipboard-write", and no password in it, with a note that a host passes the password in init.
        7. e2e/embed-host: a page served from a second origin in the end-to-end run that frames the room, sends init and topics.set, and records ready, poker.revealed, topic.decided and resize.
        8. Event embed_loaded through the track facade, with no origin and no identifier.
        9. Conventions of every room row: the code lives in one feature directory, apps/room/src/features/embed/, plus its one registration line in apps/room/src/features/index.ts and its message file; nothing else in a shared file changes, except the header in apps/api (step 4), e2e/embed-host and docs/v9/embed.md. Every visible string, accessible names and placeholders included, comes from the message catalogue, with English and German complete in this pull request (Spanish, French and Simplified Chinese fall back to English until v9-room-translations). The test ids of e2e/TESTIDS.md stay; new ones are added to that file. The pull request extends the end-to-end suite and the component tests for what it adds and attaches the screenshots make ui-shots writes for the states it touched. basalt-ui components and tokens only: a missing piece is filed with factory issue new --repo basalt-ui and named in the pull request, never patched here; basalt-ui's design reviewer runs before review is asked for. The table is @fpp/table, mounted through apps/room/src/table-entry.ts; this row never reaches into it.
      acceptance: |-
        - An end-to-end test with the host page: ready arrives with version 1; topics.set with three topics fills the queue; after a unanimous round the host receives topic.decided deep-equal to the room-core builder's output for that round.
        - An end-to-end test: a message whose source is not the parent window changes nothing, and so does one from a second origin after init fixed the host's; every postMessage the room sends names the host's origin (asserted with a spy).
        - A test: /room/<slug>?embed=1 answers with frame-ancestors https: (or the value of the environment variable when set), /room/<slug> with 'none'; a page cannot frame the direct room.
        - A test scans every message the room sent in the end-to-end run and finds no seat secret.
        - At 320 px wide the embedded room has no horizontal scroll and every action is reachable.
        - make ui-shots STATES='embed*' writes the embedded room at 320, 480 and 1280 px, light and dark, and the snippet section.
        - make check passes.
      scope: |-
        No host shell for any platform (after launch). No webhooks. No change to the result contract of packages/room-core.

  - key: v9-room-errors
    title: 'Browser telemetry for the room: uncaught errors, rejected promises and connection state changes as OTLP logs to /api/otel, with the content policy test extended to the browser'
    kind: feature
    prio: 1
    seat: {role: lead}
    after: [v9-room-shell, v9-api-telemetry]
    after_needs: shipped
    facts:
      why: |-
        A bug in a browser must be visible without replays or a third-party script. Contract: docs/v9/ARCHITECTURE.md section Measurement (the paragraph on browser telemetry: uncaught exceptions, rejected promises and the connection state changes of @fpp/room-client, sent as OTLP logs to /api/otel with a session id that lives in memory for one page load; no replay, no field web vitals; @hyperdx/browser is not used), invariant 11 (no vote value, display name, room name, topic title, tracker key or access code; a room as its numeric id, a seat as its index), docs/v9/ENGINEERING.md section Code patterns (capture once, at the browser's global handlers), and this repo's docs/observability.md (the severity tree; never capture user input, business conflicts or WebSocket close 1006). The service fpp-room is registered by v9-vps-next.
      what: |-
        packages/telemetry (the browser facade), apps/room/src/features/errors/ (the wiring, a feature with no screen) with its registration line, apps/api/src/http only if /api/otel is missing, tests.
      change: |-
        1. Read what v9-api-telemetry shipped: a browser facade in packages/telemetry, a route /api/otel. If the route is missing, add POST /api/otel in apps/api/src/http: it takes OTLP/HTTP JSON logs, refuses bodies over a size you decide, limits requests per address, sets the service name fpp-room itself rather than trusting the browser, forwards to the collector endpoint from the environment, and with no endpoint configured answers 204 and drops.
        2. The browser facade in packages/telemetry: recordError(error, { component, action }, severity) and a log record for a connection state change, batched and sent with fetch keepalive, flushed on pagehide. The session id is crypto.randomUUID() held in memory for one page load, never written to storage. Attribute names only from the ATTR registry. Decide whether the OpenTelemetry web SDK is worth its size or a small exporter is enough, and record the bytes.
        3. Wiring, once each: window error and unhandledrejection handlers; one error boundary at the room route; @fpp/room-client's status changes (from, to, close code, build) as info records. A close 1006 is no error.
        4. Scrubbing: URLs in messages and stacks are rewritten to /room/:slug with no query and no fragment; the room appears only as its numeric id if the view carries it, else not at all; a seat only as its index.
        5. The content policy test of v9-api-telemetry extended to the browser: a full round in the browser with marker strings as display name, slug, vote value, topic title and password; every OTLP payload sent (captured at the route or by a fake exporter) contains none of them.
        6. No visible string is added. The test ids of e2e/TESTIDS.md stay.
      acceptance: |-
        - A test: an error thrown in a component produces exactly one log record with component and action; a rejected promise one; live, reconnecting, live two state records.
        - The marker test passes, and fails when the slug is added to an attribute (shown once in the pull request).
        - A test: with no endpoint configured nothing is sent; the session id is in neither localStorage nor sessionStorage.
        - If the route was added: a body over the limit is refused with 413 and the service name in the forwarded payload is fpp-room whatever the browser sent.
        - The room entry's gzip size before and after is in the pull request and stays at most 180 kB.
        - make check passes.
      scope: |-
        No Umami events (the track facade is another channel). No dashboards or alerts (the vps repo, stage 3). No server metrics.

  - key: v9-room-record
    title: 'The personal record: rounds played, how often you matched the most common card and whether you vote higher or lower than your teams, computed and kept on the device only'
    kind: feature
    prio: 1
    seat: {role: light}
    lane: ui
    after: [v9-room-shell]
    after_needs: shipped
    facts:
      why: |-
        A person who estimates every week wants to know how they estimate, and nobody else should. Behaviour: docs/v9/UX.md section Game feel without fatigue (the last paragraph: the personal record lives only on the device, is computed in the browser from what the own seat saw and is never sent anywhere). Contract: docs/v9/ARCHITECTURE.md section Client (the storage key stats under fpp:v9:, with a schema version, the local-only personal record) and invariants 10 and 11. Small and mechanical: one pure module, one storage value, one settings section.
      what: |-
        apps/room/src/features/record/ (a pure module with unit tests, the storage value, a settings section) with its registration line and message file; component tests.
      change: |-
        1. A pure module folds the events the own seat sees into three figures: rounds played (a revealed round in which this seat had a card); how often the own card was the round's most common card; and the tendency, the mean distance in deck positions between the own card and the round's median card, with its sign (higher or lower). A round in which the seat abstained with '?' or took the break card does not count. Positions, not values, so a T-shirt deck compares with Fibonacci.
        2. The figures are kept under fpp:v9:stats with a schema version, updated once per revealed round, and survive a reload. Nothing of it enters a command, a request, a telemetry record or an Umami event.
        3. A settings section 'Your record' shows the three figures in plain sentences, says in one line that they never leave this device, and has a button that clears them. With fewer than ten rounds it says that the record is still thin instead of showing a tendency.
        4. Conventions of every room row: the code lives in one feature directory, apps/room/src/features/record/, plus its one registration line in apps/room/src/features/index.ts and its message file; nothing else in a shared file changes. Every visible string, accessible names and placeholders included, comes from the message catalogue, with English and German complete in this pull request (Spanish, French and Simplified Chinese fall back to English until v9-room-translations). The test ids of e2e/TESTIDS.md stay; new ones are added to that file. The pull request extends the component tests for what it adds and attaches the screenshots make ui-shots writes for the states it touched. basalt-ui components and tokens only: a missing piece is filed with factory issue new --repo basalt-ui and named in the pull request, never patched here. The table is @fpp/table, mounted through apps/room/src/table-entry.ts; this row never reaches into it.
      acceptance: |-
        - Unit tests of the fold on fixtures: a matching vote, a higher and a lower one, an abstention, a T-shirt round, and a second vote on the same topic counted as its own round.
        - A component test: after three revealed rounds the section shows three rounds played; after a reload it still does; the clear button empties it.
        - A test with a marker in the stored value asserts that no request body or URL, no WebSocket frame, no call of the track facade and no log record carries it.
        - make ui-shots STATES='record*' writes the thin record and a full one at 360 and 1280 px, light and dark.
        - make check passes.
      scope: |-
        No comparison between people, no server side, no badge during play. The room's own statistics are v9-room-insights'.

