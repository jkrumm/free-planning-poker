        2. Sounds: five short samples, card placed, reveal, consensus, poke, someone joined. v1 has join.wav, leave.wav, success.wav and tick.wav (git show origin/v1:apps/web/public/sounds/<file>): reuse what fits; a new sample needs a licence that allows it in a public repository, recorded per file. Web Audio: the AudioContext is created or resumed inside a user gesture, samples fetched and decoded on first use, so they cost the entry nothing. Silent unless the preference sound is on (off for new users) and calm mode is off. Nothing loops.
        3. Haptics: a 10 ms navigator.vibrate when the own card lands, feature-detected and wrapped so it returns false instead of throwing; never the only feedback; nothing on iOS, which offers none to pages. Off when the preference is off or calm mode is on.
        4. Reactions: an emoji thrown at a seat, an arc, a small bounce, gone; the react intent of the contract sends it. They arrive as fx frames, never stored: if the contract has no way to hand fx to the entry, add one additively and describe it in TABLE-BRIEF.md; if protocol.md has no fx type for reactions, add it in packages/room-core following the rule for a protocol change. One per 2 s per person, as the server limits it. The poke uses the same layer and the poke sound. Off in calm mode and when the room has reactions switched off.
