    after: [v9-site-scaffold, v9-ui-foundation]
    after_needs: shipped
    facts:
      why: |-
        docs/v9/ENGINEERING.md section Working with basalt-ui: the site profile (basalt-ui Issue 2531: parts that are plain React and render to static HTML with no provider, no hook and no router, no baked-in string, logical properties, a prose part for raw Markdown, a theme switch, mobile menu and copy button built on the platform), the marketing blocks (Issue 2532), and the four rules of that section. docs/v9/ARCHITECTURE.md section Stack (basalt-ui in apps/site); docs/v9/UX.md section The marketing site (light and dark follow the system and can be switched). The donation link is the old backlog's item (docs/v9/PLAN.md section The old backlog, mapped).
      what: |-
        apps/site (the basalt-ui dependency and the files its init writes for the site, the base layout, header, footer, prose styles), apps/site/src/config (the donation constant), the script allowlist, tests.
      change: |-
        1. First: read the documentation of the installed basalt-ui for a site or Astro profile, and the registry (agw web package npm basalt-ui). If neither the installed release nor the latest on npm ships one, defer this Issue by seven days with factory issue defer and end the turn; repeat on each wake. Never install from a path, a git URL or basalt-ui's master.
        2. Install the profile through basalt-ui's init from the local bin (never bunx), with its presets as shipped. Tokens and parts render at build time: no provider, no hook, no router.
        3. Header with navigation (Guide, Docs, Statistics, Roadmap, the blog once a post is published, and Start planning linking /room/new) and the profile's mobile menu. Footer with /privacy, /imprint, /contact, the repository, the licence, and the donation link: a constant the owner fills (Buy Me a Coffee); an empty constant hides the link.
        4. Light and dark follow the system; the profile's theme switch changes it. The room keeps the theme in prefs under fpp:v9: on the same origin (docs/v9/ARCHITECTURE.md section Client): use that value if the profile allows it, else record why not.
        5. The profile's prose part styles raw Markdown by element on every collection page, with the copy button on code blocks.
        6. The strings of header, footer and accessible names come from the site's content file or the message catalogue, never a literal in a component (invariant 18).
        7. Page JavaScript outside islands at most 12 kB gzip: a test sums the executable scripts of each built page, islands excluded. Each script the profile adds goes on the allowlist with its reason.
        8. The social image template of v9-site-schema takes the tokens if that row has shipped.
        9. Run basalt-ui's design reviewer before review. A missing part is an Issue in basalt-ui (factory issue new --repo basalt-ui) with a minimal reproduction, never a local patch; the pull request names what was filed.
      acceptance: |-
        - basalt-ui's doctor command exits 0 for apps/site.
        - The script budget test passes on every page and fails on a planted 13 kB script.
        - git diff --stat of the pull request shows no file under apps/site/src/content changed: every page takes the look without a change to its content.
        - A test: the footer shows the donation link with the constant set and none with it empty.
        - Screenshots of /, /guide and /privacy at 360 and 1280 px wide, light and dark, taken with the browse skill, are in the pull request.
        - make check passes.
