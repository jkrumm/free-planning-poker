        4. Social images at build time, one per page, 1200 by 630 pixels, from the page's title and description in one template. Decide the tool (pinned exactly, version checked with agw web package npm <name>; nothing at runtime, no external service) and record why. Tags: og:title, og:description, og:url, og:type, og:image with its size, twitter:card summary_large_image. The template stays plain; v9-site-look restyles it.
        5. A head test walks the built output and fails on any page without a title, a meta description, a canonical link, or an og:image whose file exists.
      acceptance: |-
        - make site exits 0; the head test passes on every page of the production and the beta output and fails on a planted page without a description (shown once in the pull request).
