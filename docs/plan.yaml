  - key: v9-selfhost
    title: 'Self-hosting in one compose file: the published image with Postgres, a documented example env file, the /self-hosting page, and a workflow that follows the page on a clean runner'
    kind: feature
    prio: 1
    seat: {role: lead}
    after: [v9-e2e, v9-site-scaffold]
    after_needs: shipped
    facts:
      why: |-
        docs/v9/STRATEGY.md and the landing page (docs/v9/UX.md section The marketing site, block 5 and row /self-hosting) promise one compose file. docs/v9/ARCHITECTURE.md section Topology: the same image with a Postgres container is the self-hosting story and the system under test; docs/v9/ENGINEERING.md section CI: the suite tests the compose file users self-host with. v9-api-image wrote deploy/compose.yml for local runs and tests, with a locally built image.
      what: |-
        The self-hosting compose file (decide: deploy/compose.yml with the image as a variable, or a second file under deploy/ or at the root; record), deploy/.env.example, image publishing in .github/workflows if no public image exists, the page /self-hosting in apps/site, .github/workflows/selfhost.yml, docs/development.md.
      change: |-
        1. A public image: find where the beta deploy pushes the API image. If no public tag exists, publish it to this repository's GitHub Container Registry on pushes to master and on releases; decide the tags (the short hash, the version, latest) and record them. An anonymous pull must work.
        2. The compose file: the published image, postgres:18 with a named volume, health checks on both, one published port, a restart policy. Every setting from the environment with a safe default; settings that are secrets (the Postgres password, the key behind visitor_day's hash) have no default and stop the start with a message that names them. Read the settings from apps/api's own environment schema on the day.
        3. deploy/.env.example documents every setting: its default, and what happens when it is unset (Umami off, telemetry off, contact and feedback answer 503). No secret value anywhere in the repository.
        4. The end-to-end suite keeps testing the file users self-host with; if a second file is chosen, both share one base and CI's e2e uses it. Record.
        5. /self-hosting: what is needed (Docker with compose), then the commands in one block, literally: fetch the compose file and the example env file, generate the secrets, start, open /room on the published port; then updating, backing up the volume, and what is not included (Umami, telemetry, a TLS proxy of your own). English, published.
        6. selfhost.yml: on pull requests that touch deploy/, the page or the workflow, and nightly at a minute that is not on the hour, on a clean ubuntu-24.04 hosted runner: extract the command block from the page's source and run it as written, wait for /api/health to answer 200, then run the end-to-end suite's smoke subset (two seats, one round) against the local address. It is a signal, not part of the gate job ci.
      acceptance: |-
        - selfhost.yml is green on the pull request (the run's link in the pull request) and carries its nightly schedule.
        - Changing a command on the page changes what the workflow runs (the extraction reads the page's source; shown once).
        - docker compose up with only the example env file stops with a message that names the missing secret.
        - The anonymous pull of the published tag succeeds inside the workflow; rg finds no secret value under deploy/.
        - make check passes.
      scope: |-
        No Kubernetes, no Umami or ClickStack in the compose file, no TLS proxy. The beta host's deploy is not changed beyond publishing the image.

