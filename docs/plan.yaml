      what: |-
        apps/site/src/pages: privacy, imprint and contact; the contact form; the footer links; tests.
      change: |-
        1. /privacy in plain words, in short sections. Who runs the service: as the imprint names it, nothing more. What a room stores and for how long: a room's number is held three months after its last visit and a booked name six months; rounds and their results are kept, and history names seats by number, never by name; the live state with names expires 6 hours after the room's last event; the access code of a locked room is stored readable and shown to every seat. Counting: one row per device and day with a vote, holding a keyed hash of the anonymous device id and a date, deleted after 13 months. Measurement: Umami's cookieless script from our own origin under /api/u, no cookie, no banner, no identifier from us, room paths rewritten so no room name or code is sent, the events and their properties as section Measurement lists them, Umami's session that rotates monthly; error telemetry without content, with a session id that lives for one page load. What stays on the device: the keys under fpp:v9:. The contact form: what it sends and through whom (read v1's privacy section, git show origin/v1:apps/web/src/pages/imprint.tsx, and keep the facts that still hold). How to ask for deletion: the contact form, and what the owner can delete by hand.
        2. Every number in that text comes from a named constant or a section of docs/v9; the pull request lists each with its source.
        3. /imprint: v1's imprint word for word (the same file: Operated by, Contact, Project License, Donations). Its wording is a deliberate choice of the owner: do not add an address or an e-mail. v1's page also holds a privacy section that describes v1's own measurement; replace that section with one sentence that links /privacy, and record it.
