    prio: 1
    seat: {role: light}
    lane: ui
    after: [v9-room-topics, v9-api-read]
    after_needs: shipped
    facts:
      why: |-
        The person who runs the meeting wants a record at the end (UX.md section Who uses it). Behaviour: docs/v9/UX.md section Flows (Ending a session: every topic with its final value, spread, number of rounds and duration; copy as Markdown and export as CSV; a topic without a final value shows its most common card, marked as open). Contract: docs/v9/ARCHITECTURE.md section HTTP API (GET /rooms/:slug/summary as JSON, CSV and Markdown, proof a seat of that room) and invariant 15. Small and mechanical: one view and two actions over data the API already shapes.
      what: |-
        apps/room/src/features/summary/ (a panel and a menu command) with its registration line and message file; end-to-end and component tests.
      change: |-
        1. Read GET /api/rooms/:slug/summary as v9-api-read merged it: how a format is chosen (query or Accept header), the JSON shape, how an open topic's most common card is marked. Use it as it is. If the view needs a field the route lacks, do not compute it in the browser: add that one field to the route in apps/api/src/http with a test, or, if it is more than one field, list it in the pull request.
        2. The panel: one line per topic with its title (and its reference as a link), its final value or its most common card marked 'open', its spread (lowest to highest card), its number of rounds and its duration, formatted through Intl. Opened from the menu and offered when no queued topic is left.
        3. Copy as Markdown: fetch the Markdown form with the seat secret in the Authorization header, write it with navigator.clipboard.writeText, confirm.
        4. Export as CSV: fetch the CSV form the same way and download it as a file named after the room's address and the date.
        5. Round badges (docs/v9/UX.md section Game feel without fatigue): fastest round and widest spread, each on the topic that earned it, computed from the summary's own fields and shown here only, never during play.
        6. Event summary_exported through the track facade of @fpp/telemetry, with the format (markdown or csv) and nothing else.
        6. Conventions of every room row: the code lives in one feature directory, apps/room/src/features/summary/, plus its one registration line in apps/room/src/features/index.ts and its message file; nothing else in a shared file changes. Every visible string, accessible names and placeholders included, comes from the message catalogue, with English and German complete in this pull request (Spanish, French and Simplified Chinese fall back to English until v9-room-translations). The test ids of e2e/TESTIDS.md stay; new ones are added to that file. The pull request extends the end-to-end suite and the component tests for what it adds and attaches the screenshots make ui-shots writes for the states it touched. basalt-ui components and tokens only: a missing piece is filed with factory issue new --repo basalt-ui and named in the pull request, never patched here; basalt-ui's design reviewer runs before review is asked for. The table is @fpp/table, mounted through apps/room/src/table-entry.ts; this row never reaches into it.
      acceptance: |-
        - An end-to-end test: after two decided topics and one without a final value, the panel lists three, the third marked open with its most common card.
        - An end-to-end test: the copied Markdown (read through the clipboard permission) equals the route's Markdown, and the downloaded CSV equals the route's CSV.
        - A test: no request URL carries the seat secret; it travels in the Authorization header only.
        - A test: summary_exported is called once per action with the format only.
        - make ui-shots STATES='summary*' writes the panel with decided and open topics and with none, at 360 and 1280 px, light and dark.
        - make check passes.
      scope: |-
        No insights (v9-room-insights). The route and its formats are v9-api-read's.

  - key: v9-room-insights
    title: 'The Insights panel: rounds per session, share of consensus, typical spread, time to reveal and how often each card wins, from the room''s history with basalt-ui''s charts'
    kind: feature
    prio: 1
    seat: {role: lead}
    lane: ui
    after: [v9-room-shell, v9-api-read]
    after_needs: shipped
    facts:
      why: |-
        v9 keeps every round, and the room shows what its history says (owner comment of 2026-11-20: estimation data and insights are kept). It replaces v1's sidebar statistics (UX.md table What changes for a v1 user). Behaviour: docs/v9/UX.md section Insights (In the room: rounds per session, share of rounds with consensus, typical spread, time to reveal, how often each card wins; built from basalt-ui's chart kinds: bars, lines, a weekday-by-hour heatmap, sparklines in stat cards). Contract: docs/v9/ARCHITECTURE.md sections Data model (round: started_at, revealed_at, distribution, consensus; topic: final value) and HTTP API (GET /rooms/:slug/topics). v1 for comparison: git show origin/v1:apps/web/src/components/sidebar/sidebar-room-analytics.tsx.
      what: |-
        apps/room/src/features/insights/ (a panel; the figures in a pure module with unit tests) with its registration line and message file; component tests.
      change: |-
        1. Read GET /api/rooms/:slug/topics as v9-api-read merged it (topics with their rounds, times, distributions, consensus and final values), fetched with the seat secret in the Authorization header.
        2. The figures, in a pure module: rounds per session (the documents do not define a session: decide, for example the rounds of one calendar day in the viewer's time zone, and record it); the share of rounds with consensus; the typical spread (the median distance between the lowest and the highest card, in deck positions as UX.md section The reveal measures it, so T-shirt decks compare); the time to reveal (median of revealed_at minus started_at); how often each card was the final value.
        3. The panel in basalt-ui/charts only: stat cards with sparklines, bars for the winning cards, a line for rounds per session, a weekday-by-hour heatmap of when the room estimates. Every chart has a text alternative. No other chart library.
        4. An empty state that points at the first round, a loading state, and an error that says what happened and what to do. The panel refreshes, debounced, after poker.revealed and topic.decided.
        5. In the pull request, list what v1's sidebar showed and say for each whether it is covered or dropped, and why.
