        Spanish, French and Simplified Chinese ship in 9.0.0 beside English and German (owner comment of 2026-11-21; docs/v9/UX.md section Languages), filled by this one row once every room feature exists; until then a missing key falls back to English. They stay marked 'beta' in the language switch, with a link to the catalogue file in the public repository, until a native speaker has read them. The site's landing page is translated by v9-site-landing-i18n, which reuses this row's glossary; guides and documentation stay English. Contract: docs/v9/ARCHITECTURE.md invariant 18 and section Client (paragraph Languages: ICU plurals, Intl for numbers and dates, logical properties). Research: docs/v9/research/r24-i18n.md sections 3 and 5 (drafts are made by machine and reviewed by a native speaker; CJK line breaking and font fallback were not researched).
      what: |-
        docs/v9/glossary-i18n.md (new), the es, fr and zh-Hans catalogue files of every feature, of the shell and of packages/table (paths as the catalogue tool lays them out), the English and German files where step 6 corrects copy, the message check configuration, the screenshot test configuration and the pinned container's fonts.
      change: |-
        1. The glossary first: docs/v9/glossary-i18n.md, one table with a row per fixed term and a column per language (en, de, es, fr, zh-Hans) plus a note: planning poker, story points, reveal, spectator, deck, topic, round, final value, seat, card, room, invite, password, lock, spread, consensus, re-vote, break, abstain, and every other term the catalogue repeats (search the English files). Where a language's agile practice keeps an English term, say so in the note.
        2. Translate every key of the English catalogue into es, fr and zh-Hans using the glossary. Plural messages carry every category Intl.PluralRules reports for the locale (zh-Hans has only other). No string is concatenated from parts.
        3. Back-translation: translate each new catalogue back into English in a separate pass that sees only the translation, compare with the English source key by key, and resolve every difference of meaning in the translation. The pull request holds the table: key, source, back-translation, fix.
        4. Chinese on screen: no web font is added. Name system fonts that carry the glyphs in the font stack (PingFang SC, Microsoft YaHei, Noto Sans CJK SC, then sans-serif); if basalt-ui's font token lacks them, file that in basalt-ui and record it. Set line breaking for CJK text and long tokens (decide the CSS and record it). The pinned screenshot container must have a CJK font installed, or the screenshots show empty boxes: add it to the image through the Makefile target if missing.
        5. The screenshot tests run the pseudo-locale and es, fr and zh-Hans at 360 px for every state make ui-shots knows; the overflow check fails on clipped text in any of them. The message check now enforces all five languages; the runtime fallback to English stays as a safety net.
        6. English and German read once against UX.md section Copy (labels are verb plus object; an error says what happened and what to do; an empty state points at the first action; one word per thing: room, seat, round, card, reveal, topic) and corrected; the pull request lists every changed key.
        7. The language switch keeps the 'beta' mark and the link for es, fr and zh-Hans. Add one paragraph to the glossary file on how a native speaker reports a correction (a pull request on the catalogue file).
      acceptance: |-
        - The message check passes with five languages; a planted missing Spanish key fails make check-fast.
        - make ui-shots writes every state in es, fr, zh-Hans and the pseudo-locale at 360 px, and the overflow check finds no clipped text in any of them.
        - A screenshot test asserts that Chinese text renders with glyphs from an installed font (no fallback boxes), in the pinned container.
        - A test formats every plural message with 0, 1, 2, 5 and 21 in all five languages without a missing category.
        - docs/v9/glossary-i18n.md lists every term in five languages, and the back-translation table in the pull request has a fix or a reason for every difference.
        - make check passes.
      scope: |-
        Not the site: its landing page is v9-site-landing-i18n's. No native speaker's review (the owner's, after launch). No right-to-left language. No new feature or screen.

  - key: v9-room-polish
    title: 'Polish the finished room by measurement: every arena scenario in the real shell, one-thumb reach and five languages at 360 px, axe, the keyboard path, the entry budget and reveal frame times'
    kind: feature
    prio: 1
    seat: {role: lead}
    lane: browser
    after: [v9-room-translations, v9-room-errors]
    after_needs: shipped
    facts:
      why: |-
        Each row proved its own screens; this row proves the whole room together, on a phone and with thirty seats, by numbers and not by taste, so the owner's verdict is on a room that already meets its floor. Behaviour: docs/v9/UX.md sections Principles (3, the fast path is never slower than v1; 5, no action missing on a 360 px screen), Layout by size, Phone (every card reachable with one thumb, names in the seat grid wrap rather than truncate), Accessibility. Contract: docs/v9/ARCHITECTURE.md section Testing (the budget: room entry JavaScript at most 180 kB gzip) and docs/v9/UX.md section The table arena (the floor: at 30 seats the reveal keeps a median frame under 20 ms in Chrome with the CPU slowed four times). A finding that needs a decision of taste is listed for the gate, not decided.
      what: |-
        e2e/polish (a Playwright suite over the scenarios in the real shell, kept as a regression suite), fixes inside the feature directory or package that owns each finding, docs/v9/evidence/room-polish.md (the findings table and the list for the verdict).
      change: |-
        1. Mount every arena scenario in the real shell against the built image: 2, 5, 9, 16 and 30 seats (seated by bun run bots or the simulator through @fpp/room-client; decide which and record it); the phases voting, countdown, unanimous reveal, split reveal, second vote, settled; 360 by 640, 1280 by 800 and 1920 by 1080; light and dark; reduced motion on and off. At 360 px every screen also runs in all five languages.
        2. On every screen: no horizontal scroll (the document's scroll width at most the viewport width); no clipped text (the overflow check of v9-room-ui-tests); no serious or critical axe finding; names in the seat grid wrap.
        3. One thumb at 360 by 640: decide a measurable rule (a reach zone of the screen and a minimum target size; WCAG 2.5.8 asks 24 px, 44 px is the common touch guideline) and record it; every card, vote, reveal, re-vote, next topic and invite must meet it.
        4. The keyboard path: one test plays a whole round with the keyboard only (join, vote by digit, reveal with its confirmation, settle through the table's keyboard path, next topic, open the Invite panel and copy, open and close settings), with focus visible at each step.
        5. Budgets: the entry at most 180 kB gzip (size-limit); the frame times of the reveal at 30 seats in the real shell with the CPU slowed four times, measured with the scorecard's code from the arena, median at most 20 ms.
        6. Fix each finding in the feature or package that owns it. List each in docs/v9/evidence/room-polish.md and in the pull request: the finding, the number before and after, the screenshots before and after.
        7. List every finding of taste under 'For the verdict' in the evidence file with a screenshot, and decide none of them.
        8. Decide which part of the suite runs on every pull request in lane app and which runs nightly, inside the end-to-end budget of 6 minutes (docs/v9/ENGINEERING.md section Targets); record it.
      acceptance: |-
        - The suite passes; its pull request subset and its nightly part are wired in ci.yml and nightly.yml.
        - At 360 px in five languages: zero screens with horizontal scroll or clipped text (the count is in the pull request).
        - axe: zero serious or critical findings on every screen.
        - The keyboard test passes.
        - The entry's gzip size (at most 180 kB) and the median frame of the reveal at 30 seats (at most 20 ms) are in the pull request with the run that measured them.
        - docs/v9/evidence/room-polish.md lists every finding with before and after, and the findings for the verdict apart.
        - make check passes.
      scope: |-
        No new feature, no copy rewrite (v9-room-translations), no decision of taste (v9-room-verdict).

  - key: v9-room-verdict
    title: 'The owner''s verdict on the finished room on the beta host: one session walked through, the numbers with their sources, and what only he can try (gate)'
    kind: feature
    prio: 1
    seat: {role: lead}
    checkpoint: gate
    lane: browser
    after: [v9-room-polish, v9-e2e, v9-next-deploy, v9-load]
    after_needs: shipped
    facts:
      why: |-
        The third of the plan's five gates (docs/v9/PLAN.md section Rules): the owner judges the finished room on the beta host, next.free-planning-poker.com, before the cutover is planned on it. A gate with no default: only his verdict ends the wait. Some things no test can show: whether a locked room's link survives being pasted into Teams and Outlook (docs/v9/research/r22-invite-links-room-names.md found no documentation of fragment handling there), how a round with real colleagues feels, and the install on his own phone.
      what: |-
        The Spec at docs/v9/evidence/room-verdict.md; after the verdict, the notes applied in the feature directories that own them or written as rows in docs/plan.yaml, and the verdict recorded in the evidence file and on the Issue.
      change: |-
        1. Confirm the beta host runs the head of master (GET /api/version against git rev-parse origin/master), that make verify and make e2e-beta pass, and prepare a room there with history for the insights (decide how and record it).
        2. The Spec: a link to the beta host and to the prepared room; a walk through one session in ten steps (create, invite, join from a phone, paste topics, vote, a split reveal, settle on the distribution, re-vote, a unanimous round with its celebration, the summary and its export), each with its ui-shot; the numbers, each with its source (the room entry size from size-limit in CI, the reveal frame times at 30 seats and the axe results from docs/v9/evidence/room-polish.md, the end-to-end results with their CI run numbers, the load results from docs/v9/evidence/load.md); what is not in 9.0.0 (UX.md section Decks and facilitation, Not at launch; the three beta languages awaiting a native speaker); the findings of taste listed by v9-room-polish; and what only the owner can try: a locked room's link pasted into a Teams message and into an Outlook mail and opened from there, a round with real colleagues, the install on his phone. At most three open choices, each with two options and your recommendation.
        3. Submit the Spec and wait for the verdict.
        4. After the verdict: apply each note that is one small change in the feature that owns it, and write every other note as a row in docs/plan.yaml (factory plan check passes). If the fragment did not survive Teams or Outlook, say so in the evidence file and write the row that answers it. Record the verdict and what became of each note in the evidence file.
      acceptance: |-
        - docs/v9/evidence/room-verdict.md holds every part of step 2, and every number in it names its source.
        - The owner's verdict is recorded on the Issue and in the evidence file.
        - Every note is either applied, with the pull request named, or a row in docs/plan.yaml; factory plan check docs/plan.yaml exits 0.
        - make check passes.
      scope: |-
        No new feature beyond the owner's notes. The site is stage 3's; the cutover and its rehearsal are stage 4's.

  # Stage 3: the site, search, numbers and measurement. Exit: v9-site-parity.

  - key: v9-site-scaffold
    title: 'The marketing site''s scaffold: apps/site on Astro, static and unstyled, typed content collections with the draft rule, one head layout, every v1 page ported, locale routing ready'
    kind: feature
    prio: 1
    seat: {role: lead}
    after: [v9-agent-setup]
    after_needs: shipped
    facts:
      why: |-
        The site needs nothing from the spine; rows v9-site-crawl to v9-site-roadmap fill this scaffold and v9-site-look styles it later without touching its content. Contract: docs/v9/ARCHITECTURE.md sections Topology, Repo map (apps/site, package @fpp/site) and Stack (Astro on the 7.4 line, static output); behaviour: docs/v9/UX.md sections The marketing site and Languages; routing: docs/v9/research/r25-astro7-i18n.md (read against Astro 7; r24 predates it). No look, because basalt-ui 3 is not on npm yet.
      what: |-
        apps/site (package @fpp/site: astro.config, src/content.config.ts, layouts, pages, content, tests over the built output, apps/site/AGENTS.md), the Makefile target site, the lane site in .github/lanes, the job site in .github/workflows/ci.yml, project.yaml.
      change: |-
        1. Astro, @astrojs/mdx and @astrojs/sitemap pinned exactly, versions checked with agw web package npm <name>; output static; site is https://free-planning-poker.com in every build, so canonical links name production (the beta host's noindex header is v9-edge-routing's).
        2. Astro 7 changes from r25, each confirmed against the installed version (record what held): Vite 8; compressHTML defaults to jsx and removes white space between inline elements, so set compressHTML: true and test that the space in "a <em>b</em>" survives; remark and rehype plugins need @astrojs/markdown-remark with the unified processor (prefer none); src/fetch.ts is reserved; collections only as the Content Layer in src/content.config.ts with loaders from astro/loaders.
        3. Collections guides, glossary, vs, blog and docs (glob loaders) sharing one schema: title, description, published, updated, draft (default false) and questions (question and answer pairs, default empty). Until v9-site-schema ships, the layout prints questions as plain text.
        4. The draft rule (docs/v9/ENGINEERING.md section Built for the factory, row Text the owner must read): one build-time variable names the target, beta or production; unset means production, so a forgotten flag hides drafts. In production a draft has no route and every list (indexes, sitemap, llms.txt, feeds) reads through one helper that drops drafts; on beta a draft is built with a draft line and robots noindex.
        5. One base layout with the head every page needs: title, meta description, canonical link, robots meta, lang, and slots for social image tags and structured data. Semantic HTML in source order, no CSS. Navigation and footer strings in one content file (invariant 18).
        6. A page for every v1 URL with v1's text as it stands (git show origin/v1:apps/web/src/pages/<name>.tsx and its components): / (anchors features and privacy kept), /guide (with points-table.tsx; anchor master-the-art-of-planning-poker kept), /analytics (a placeholder: the figures return with the new statistics page; v1's invented fallbacks are not ported), /roadmap (v1's static words), /contact (v1's words; the form comes with v9-site-legal), /imprint, and a 404 page. /room* and /_room/* are not the site's.
        7. Choose trailingSlash and build.format so every v1 path (/guide has no slash) is served by Workers static assets without a redirect; record.
        8. i18n: locales en, de, es, fr, zh; defaultLocale en; routing.prefixDefaultLocale false and routing.redirectToDefaultLocale false, set explicitly (the defaults changed in Astro 6); i18n.fallback NOT set, with a comment why: a fallback builds a page in every language for every page of the default one, the thin duplicate the site must not have; without it a missing translated URL is a 404. No translated page here (v9-site-landing-i18n), and no redirect by browser language (a static build sees no request header).
        9. Zero JavaScript by default: a test over the built HTML fails on any executable script (inline or external, any emitted .js file) not on an allowlist in apps/site/test, each entry with its reason; empty here. JSON-LD is data and allowed.
        10. make site builds both targets and runs these tests; the lane site covers apps/site; the job site of ci.yml builds, checks links and page budgets (ENGINEERING.md section CI) and is in the needs of the gate job ci; project.yaml knows the target. Not deployed (v9-edge-routing).
      acceptance: |-
        - make site exits 0 and writes the production and the beta output.
        - A test finds /, /guide, /analytics, /roadmap, /contact, /imprint and the 404 page in the production output, each with title, description, canonical link https://free-planning-poker.com plus its path, and step 6's anchors.
        - A draft fixture is absent from the production output and every list, and present with noindex on beta.
        - The script test passes with an empty allowlist and fails on a planted script tag; the white-space test passes.
        - The output has no directory de, es, fr or zh; astro.config sets both routing flags false and no fallback.
        - A pull request touching only apps/site runs the job site, skips lane app, and the gate job ci passes.
        - make check passes.
      scope: |-
        No styling (v9-site-look), crawl files (v9-site-crawl), structured data or social images (v9-site-schema), new content (v9-site-legal to v9-site-roadmap), deploy (v9-edge-routing) or analytics script (v9-umami-events).

  - key: v9-site-crawl
    title: 'Search plumbing for the site: robots.txt with the crawler policy, a sitemap without drafts or rooms, llms.txt and Markdown twins, the IndexNow key and ping'
    kind: feature
    prio: 1
    seat: {role: light}
    after: [v9-site-scaffold]
    after_needs: shipped
    facts:
      why: |-
        docs/v9/UX.md section Being found, rows The crawlers are let in, Bing, and llms.txt and Markdown twins, and the owner's ruling that AI crawlers are welcome (docs/v9/STRATEGY.md section Rulings of gate 1: search, user-triggered and training crawlers allowed). Research: docs/v9/research/r20-ai-search-visibility.md sections 2, 3 and 9. Small and mechanical: each piece is a build output with a test over it.
      what: |-
        apps/site: the robots.txt and llms.txt endpoints, the .md twin route, the sitemap settings in astro.config, scripts/indexnow.ts, tests. The Makefile target indexnow.
      change: |-
        1. robots.txt generated at build time: a group for every crawler the policy names, allowing the search, user-triggered and training crawlers of the assistants and of the search engines by name. r20 section 3 lists the names as of 2026-11-20; read the current names from each vendor's own documentation on the day and list each with its source address and the date in a comment. Every group, the catch-all included, disallows /room, /_room/ and /api/. One Sitemap line with the production address.
        2. The sitemap through @astrojs/sitemap: a filter that drops drafts (through the scaffold's helper) and every path under /room; lastmod from the updated date of the frontmatter, which changes only when the content does (r20, Decide now, item 8).
        3. /llms.txt generated: the product in one line, then one section per collection listing every published page with its title, address and description. Every content page (the pillar /guide and the entries of guides, glossary, vs, blog and docs) gets a twin at its path plus .md, holding its Markdown under a short block of title, address and updated date. Drafts are left out of both in production.
        4. IndexNow: the key file at the site root (the protocol makes the key public; decide whether it is committed or a build variable, and record). scripts/indexnow.ts, run by make indexnow, sends the URLs that changed since the previous deploy (decide how: the diff of the two sitemaps, or the pages the push touched; record) in one request to the endpoint documented on indexnow.org. If v9-edge-routing has shipped, call it as the last step of the site's deploy job; otherwise note on that row's Issue (factory issue note) that it wires make indexnow in.
        5. On the beta target make indexnow does nothing and prints that it skipped. The noindex header of the beta host belongs to v9-edge-routing; nothing here undoes it.
      acceptance: |-
        - A test over the built robots.txt: every listed agent has an Allow group, every group disallows /room, /_room/ and /api/, and the Sitemap line names the production sitemap.
        - A test: the production sitemap holds no draft fixture and no path under /room.
        - A test: /llms.txt lists every published content page and no draft, and every page it lists has a .md twin in the output.
        - make indexnow on the beta target exits 0 and prints the skip; with its dry-run flag on the production target it prints the URLs it would send and sends nothing.
        - make check passes.
      scope: |-
        No structured data or social images (v9-site-schema). No change to the zone's bot settings at Cloudflare (v9-edge-routing measures them). No Search Console or Bing Webmaster account: those are the owner's.

  - key: v9-site-schema
    title: 'Structured data and social images for every page: typed schema.org components, FAQPage from the visible questions, social images built per page, and a head test over the built site'
    kind: feature
    prio: 1
    seat: {role: lead}
    after: [v9-site-scaffold]
    after_needs: shipped
    facts:
      why: |-
        docs/v9/UX.md section The marketing site (every page gets its own title, description, canonical link, social image and structured data, none of which v1 has) and section Being found, row Structured data; the owner's ruling of 2026-11-20 that FAQPage stays (docs/v9/STRATEGY.md section Rulings of gate 1). docs/v9/research/r20-ai-search-visibility.md section 4: Google still lists Organization, SoftwareApplication, Article and BreadcrumbList; FAQ rich results ended on 2026-05-07; SoftwareApplication carries ratings only when they are real.
      what: |-
        apps/site/src/components/schema (Organization, WebSite, SoftwareApplication, Article, BreadcrumbList and the Questions component), the base layout's slots filled, the social image step, tests.
      change: |-
        1. One component per type with typed props, each writing one script of type application/ld+json into the layout's slot, built with JSON.stringify of a typed object, with a closing script tag inside a value escaped. Organization and WebSite on every page; SoftwareApplication on / (a web application, free, no aggregateRating unless real ratings exist, never self-assigned); Article on every content page, from title, description, published and updated; BreadcrumbList on every page below /. Name as author what the imprint names, or the Organization: decide and record.
        2. The Questions component takes the questions of the frontmatter (or of a page) as data, prints them as visible text (a heading, then each question and its full answer) and writes FAQPage from the same array. It is the only way FAQPage enters a page, so the markup can never say what the page does not; it replaces the scaffold's plain printing.
