  - key: v9-room-ui-tests
    title: 'The interface test harness: component tests with axe, screenshots of named room states in a pinned container, a pseudo-locale that fails on clipped text, and make ui-shots'
    kind: chore
    prio: 1
    seat: {role: lead}
    lane: browser
    after: [v9-ui-foundation]
    after_needs: shipped
    facts:
      why: |-
        Every room row of stage 2 proves its screens the same way, so the harness is built once, before them. Contract: docs/v9/ARCHITECTURE.md sections Testing (the Component tier: Vitest browser mode in Chromium with axe, in make check from stage 2; the End to end tier: screenshots in a pinned container from stage 2) and Client (paragraph Languages: a pseudo-locale with lengthened strings runs in the screenshot tests to catch clipped labels); docs/v9/ENGINEERING.md sections Targets, Local checks and Built for the factory. docs/v9/research/r09-testing-ci.md: visual baselines are rendered in the same pinned container CI uses, with animations disabled, the clock fixed and timers and ids masked, so font and system drift cause no false differences; axe fails on serious and critical findings and reports moderate ones.
      what: |-
        The component test configuration of apps/room that v9-ui-foundation created, apps/room/test (fixtures, the mount helper, the axe helper, the pseudo-locale, the overflow check), the screenshot baselines, Makefile targets ui-test, ui-shots and ui-shots-update, a job ui in .github/workflows/ci.yml added to the needs of the gate job ci, AGENTS.md (one paragraph: how an interface row proves its screens), docs/development.md.
      change: |-
        1. Read how v9-ui-foundation set up Vitest browser mode (its pull request) and how the arena's scorecard pins its container (make arena-score, e2e/arena). Reuse that image and its pin, so the arena and the room render with the same fonts. Decide the screenshot mechanism (Vitest browser mode's screenshot assertion inside that container, or Playwright's) and record why in the pull request.
        2. Fixtures: the arena's scenarios exported by packages/table (2, 5, 9, 16 and 30 seats; the phases voting, countdown, unanimous reveal, split reveal, second vote, settled; away, reconnecting and spectators; containers of 360 by 640, 1280 by 800 and 1920 by 1080; light and dark; reduced motion on and off) become room states mounted by name. One helper mounts a component tree with a view from a scenario, a fake @fpp/room-client state with any connection status, a locale and a theme, the clock fixed and animation off. No socket.
        3. axe-core, pinned exactly, version checked with agw web package npm axe-core, runs in every component test through one helper: serious and critical findings fail, moderate ones are printed.
        4. The pseudo-locale is generated from the English catalogue (the catalogue tool's own pseudo-locale if it has one): every string lengthened, with accented letters and brackets, so an untranslated literal stands out. Decide by how much (at least as long as the longest German string of the same key) and record it. An overflow check runs in every screenshot test: an element whose text is clipped, ellipsised or wider than its box, or a document that scrolls sideways, fails the test with the element's test id and the locale.
        5. make ui-shots runs the screenshot tests in the pinned container (Docker only through Makefile targets; locally through factory slot run) and writes PNG files named <feature>--<state>--<width>--<theme>[--<locale>].png plus an index into one git-ignored directory; STATES=<pattern> limits it to the states a row touched. Decide how a pull request attaches them (images in its body, a CI artefact link, or committed files) and write that into AGENTS.md, so every later row does the same.
        6. Baselines are compared with a threshold you decide and record; make ui-shots-update rewrites them, inside the container only.
        7. CI: a job ui in ci.yml on lane app runs the component tests and the screenshot comparison in the pinned image and is added to the needs of the gate job ci. Every test target writes JUnit to $FACTORY_JUNIT_DIR/<name>.xml when that variable is set and nothing when it is not (software-factory docs/plan.md section Check tiers).
        8. Tiers: the component tests are part of make check. Add them to make check-fast only if it stays under 60 s; record the decision with both times.
        9. Prove it on what exists: one component test per screen of the plain room (the name field and the seat list in every connection status of @fpp/room-client).
      acceptance: |-
        - A planted label that overflows its box at 360 px in the pseudo-locale fails make ui-test and names its test id; without it the run passes (both shown in the pull request).
        - A planted contrast violation fails make ui-test with axe's rule color-contrast.
        - Two runs of make ui-shots on one commit write byte-identical files (sha256 sums listed in the pull request).
        - make ui-shots STATES=<pattern> writes only the matching files and an index.
        - With FACTORY_JUNIT_DIR set each runner writes one JUnit file; without it none is written.
        - The job ui runs on a pull request in lane app and the gate job ci waits for it; its time, the CI wall clock and the time of make check-fast are in the pull request, inside the targets of docs/v9/ENGINEERING.md section Targets (CI 8 min median, check-fast 60 s).
        - make check passes.
      scope: |-
        No new screen and no styling of the plain room. The Playwright end-to-end suite stays as v9-e2e built it; other browser engines stay in nightly.yml. The arena's scorecard is unchanged.

  - key: v9-room-shell
    title: 'The room on basalt-ui: layout by size, header, people rail, connection states, themes, the settings surface and the feature registry every later room row plugs into'
    kind: feature
    prio: 1
    seat: {tier: opus, effort: high}
    lane: ui
    after: [v9-room-ui-tests, v9-plan-table]
    after_needs: shipped
    facts:
      why: |-
        The plain room proved every command; this row gives it its frame on basalt-ui and replaces it at /room/$slug with every command still reachable and the end-to-end suite green on the same test ids. Fourteen later rows (v9-room-round to v9-room-errors) each add one feature beside the others in parallel, so the frame and the registry they plug into are built here. Behaviour: docs/v9/UX.md sections The room, Flows (First visit, Joining by link, A large room), Layout by size, Accessibility, Copy. Contract: docs/v9/ARCHITECTURE.md sections Room model, Client, Measurement. An opus seat because the registry is the seam fourteen rows build on: a wrong one makes each of them edit shared files.
      what: |-
        apps/room/src/shell (layout, header, people rail, connection screens, theme, settings surface, announcer), apps/room/src/features/index.ts (the registry) and the type of a feature definition, apps/room/src/table-entry.ts, the route /room/$slug, the shell's message files, packages/telemetry (only the room's event names, if missing), apps/room/AGENTS.md, e2e/TESTIDS.md, end-to-end and component tests.
      change: |-
        1. The registry. A feature is one directory under apps/room/src/features plus one line in apps/room/src/features/index.ts. Its definition may contribute: a header item (slots invite, switcher, menu), a panel, a settings section (with an order number), a route, a screen for a connection status, commands for the shortcut sheet (label message, key, handler), and its message file. The shell provides a context with the room client, the own seat, the view, the prefs and an announcer for the live region (UX.md section Accessibility: progress and the result, never a hint at a vote before the reveal). Split the catalogue so each feature owns its message file if the tool from v9-room-plain allows it; otherwise record how parallel rows avoid conflicts.
        2. Layout by container queries on the room container, not the viewport (UX.md section Layout by size): 1100 px and more, the table with one side panel; 700 to 1099 px, panels as sheets; under 700 px, full-screen sheets. The ring, the grid, the seat sizes (steps at 9 and 17 players, the grid under 700 px or from 25 players) and the hand are the table's.
        3. The header: the room's display name, else its primary address; the slots invite (v9-room-access), switcher (v9-room-home) and menu. The browser tab carries the room's display name, else its address.
        4. The people rail: players with presence (active, away after 30 s hidden, reconnecting) and spectators apart. Seat actions: any player kicks another seat (seat.kick); every seat renames only itself, as v1 does (git show origin/v1:apps/server/src/room.entity.ts, changeUsername, and origin/v1:apps/web/src/components/sidebar/sidebar-settings.tsx) and as ARCHITECTURE.md section Room model allows a spectator; become spectator or player (seat.setRole); leave (seat.leave). A player who finds 30 players seated is offered one of the 20 spectator seats.
        5. Joining: one name field over the visible table, focused and prefilled from profile or a suggestion; Enter seats. A name that matches a reconnecting or gone seat takes that seat's place back (section Room model, A lost seat is taken back by name).
        6. The connection states of @fpp/room-client's status: connecting, live, reconnecting (the client reports it only after 3 s), draining, reload-required (4001: a reload button; v9-room-pwa later turns it into the update path), kicked (4003: a notice, no reconnect), gone. locked and changed-hands get a placeholder that keeps the plain room's controls; v9-room-access and v9-room-address replace them through a status screen.
        7. Light and dark follow prefers-color-scheme, with a switch (system, light, dark) stored in prefs.theme through basalt-ui's persisted.
        8. The settings surface: a panel or sheet of registered sections. The plain controls whose real screens later rows build (topic queue, lock, name, auto reveal) stay reachable here, under their test ids, until those rows replace them.
        9. apps/room/src/table-entry.ts is the only module that imports a table: it names the arena's reference entry until packages/table holds the picked table, passes view, container size and preferences (calm mode, reduced motion, sound, theme) and maps the contract's intents to room-client commands.
        10. Telemetry: if packages/telemetry lacks the track facade or the room's Umami events of ARCHITECTURE.md section Measurement (room_created, room_joined, invite_copied, vote_cast, round_revealed, topic_decided, room_locked, summary_exported, pwa_installed, embed_loaded), add them all now, the facade doing nothing until Umami's script is present, so feature rows only call it. Emit room_joined with a seat bucket (decide the buckets and record them).
        11. apps/room/AGENTS.md: how to add a feature, and the conventions every room row follows.
      acceptance: |-
        - The end-to-end suite passes with no test file changed, only added to.
        - A component test defines a sample feature with one directory and one registration line; its header item, panel, settings section, status screen and command appear, and removing the line removes all of them.
        - rg finds no import of arena/entries or @fpp/table under apps/room/src outside apps/room/src/table-entry.ts.
        - The room entry's gzip size is in the pull request against the 180 kB budget, and size-limit enforces 180 kB for apps/room.
        - make ui-shots writes every connection state (connecting, live, reconnecting, draining, reload-required, kicked, gone, locked, changed-hands) in light and dark at 360, 1280 and 1920 px wide; axe reports no serious or critical finding in any of them, and the pseudo-locale passes at 360 px.
        - A test asserts that the tab title follows the room's display name.
        - make check passes.
      scope: |-
        No round bar (v9-room-round), no settings sections beyond theme (v9-room-settings), no invite or lock screens (v9-room-access), no names or changed-hands screen (v9-room-address), no /room home or switcher (v9-room-home), no topic queue (v9-room-topics), no PWA, embed or browser telemetry. Nothing changes in packages/table.

  - key: v9-room-round
    title: 'The round bar and the keys: the topic in place, the voted meter with who is missing and a poke, reveal with a confirmation, the auto reveal ring, the countdown and the shortcut sheet'
    kind: feature
    prio: 1
    seat: {role: lead}
    lane: ui
    after: [v9-room-shell]
    after_needs: shipped
    facts:
      why: |-
        The round is what a team does fifty times a meeting, and what happens around the table must be quicker than v1 (UX.md section Principles, 3). Behaviour: docs/v9/UX.md sections Flows (A round; Agreement and Disagreement as far as they are outside the table), Decks and facilitation (Timer), Accessibility (every action has a key, listed in the command palette, Cmd+K) and the table What changes for a v1 user (reveal any time after the first vote with a confirmation when seats are still thinking; auto flip becomes a setting with a cancellable countdown; the elapsed-time counter stays, plus the optional countdown). Contract: docs/v9/ARCHITECTURE.md sections Room model (the rules the reducer enforces) and Protocol; docs/v9/protocol.md is the exact reference.
      what: |-
        apps/room/src/features/round/ with its registration line and message file; packages/room-core only if the poke is missing from the protocol (schema, golden fixture, docs/v9/protocol.md); end-to-end and component tests.
      change: |-
        1. Read docs/v9/protocol.md for poker.reveal, poker.cancelReveal, poker.revote, topic.next, topic.update, the reveal countdown and the timer in the view, and the fx types. UX.md section Motion, sound, touch says the poke travels the way reactions do: an fx frame, never stored, no seq, one per 2 s per seat. If no fx type for a poke exists, add it in packages/room-core following the rule for a protocol change (schema, fixture, protocol.md and the version as .claude/rules says, in this pull request). If the timer's deadline is not in the view, add it the same way: its time is the server's, never a local clock alone.
        2. The round bar: the active topic's title, editable in place (topic.update; an untitled topic shows a placeholder); '7 of 9 voted' with an ICU plural as a segmented meter, one segment per player (decide how away players count and record it; spectators never count); the reveal button, enabled from the first vote; after a reveal, re-vote (poker.revote) and next topic (topic.next). Settling the final value is the table's (a click on the distribution).
        3. After 20 seconds of voting the bar names who is still thinking (decide whether from the round's start or the first vote, and record it), and any player can poke each of them; the button rests for 2 s after a poke. The poked seat sees a notice through the shell; its sound and motion are v9-table-feel's.
        4. A reveal while any active player is still thinking asks for confirmation ('2 still thinking. Reveal anyway?'). The same applies to every reveal path: the button, Enter and the table's reveal intent.
        5. Auto reveal: when the room's setting is on and the last active player votes, the view carries the three-second countdown; the bar shows it as a ring with a cancel button for every player (poker.cancelReveal). The timer (30, 60 or 120 seconds, set in v9-room-settings) is a ring on the bar; at zero with auto reveal off nothing happens, with auto reveal on the same cancellable ring starts.
        6. The elapsed time since the round started, as v1's counter (git show origin/v1:apps/web/src/components/room/counter.tsx), formatted through Intl.
        7. Keys: 1 to 9 and 0 vote for the first ten cards of the room's deck by position (poker.vote; a digit beyond the deck does nothing); Enter reveals, with the confirmation of step 4. Arrow keys and Enter inside the hand are the table's own floor and are not duplicated. No key acts while focus is in a text field, and Enter acts only when focus is on no control. Every key goes through the hotkey wrapper basalt-ui standardises on if the installed release carries it (basalt-ui Issue 2525), else a small local map in this directory with that Issue's number in a comment.
        8. The shortcut sheet: '?' and the command palette (Cmd+K, Ctrl+K) list every command the registry holds, with its key, in this feature.
        9. The live region, through the shell's announcer: progress ('7 of 9 voted') and the result line after the reveal; nothing before the reveal hints at a value.
        10. Events through the track facade of @fpp/telemetry, sent by the client that caused them: vote_cast (the first vote in a room), round_revealed (votes bucket, consensus), topic_decided (how: agreed or picked). No value, name or slug in any event.
        11. Conventions of every room row: the code lives in one feature directory, apps/room/src/features/round/, plus its one registration line in apps/room/src/features/index.ts and its message file; nothing else in a shared file changes, except the poke in packages/room-core if step 1 requires it. Every visible string, accessible names and placeholders included, comes from the message catalogue, with English and German complete in this pull request (Spanish, French and Simplified Chinese fall back to English until v9-room-translations). The test ids of e2e/TESTIDS.md stay; new ones are added to that file. The pull request extends the end-to-end suite and the component tests for what it adds and attaches the screenshots make ui-shots writes for the states it touched. basalt-ui components and tokens only: a missing piece is filed with factory issue new --repo basalt-ui and named in the pull request, never patched here; basalt-ui's design reviewer runs before review is asked for. The table is @fpp/table, mounted through apps/room/src/table-entry.ts; this row never reaches into it.
      acceptance: |-
        - An end-to-end test: with one seat still thinking a reveal asks for confirmation and reveals on confirm; with every seat voted it reveals at once.
        - An end-to-end test: with auto reveal on, the last vote starts the ring, a second seat cancels it, and nothing is revealed.
        - A component test with a fake clock: after 20 s the missing names show; a poke from seat A reaches seat B as a notice; a second poke within 2 s is not possible.
        - A component test: digit 3 votes the third card of the Fibonacci and of the T-shirt deck, 0 the tenth, and no digit acts while a text field has focus.
        - A component test: the timer at zero with auto reveal off changes nothing; with auto reveal on the ring starts.
        - Cmd+K opens the palette and '?' the sheet, both in English and German, with no serious or critical axe finding.
        - If packages/room-core changed: the protocol drift test passes and the fixtures of the last released protocol version still pass.
        - make ui-shots STATES='round*' writes voting at 2, 9 and 30 seats, the missing names, the confirmation, the ring, the countdown and the revealed bar, at 360 and 1280 px, light and dark.
        - make check passes.
      scope: |-
        Not the hand, the cards, the reveal, the result view or settling on the distribution (@fpp/table). Not the switches for auto reveal and the timer (v9-room-settings), not the topic queue (v9-room-topics), not the poke's sound or motion (v9-table-feel).

  - key: v9-room-settings
    title: 'Room and personal settings: profile with a generated avatar, decks with custom values, auto reveal, the timer, sounds, calm mode, haptics, the view, the theme and the language switch'
    kind: feature
    prio: 1
    seat: {role: lead}
    lane: ui
    after: [v9-room-shell]
    after_needs: shipped
    facts:
      why: |-
        Everything a person or a room can set, apart from the lock (v9-room-access) and the address (v9-room-address). Behaviour: docs/v9/UX.md sections The room (generated avatars, re-rolled in settings, no uploads), Decks and facilitation, Motion, sound, touch, Game feel without fatigue (calm mode per person; a room setting can disable reactions for everyone), Layout by size (the Table/Grid switch replaces v1's 'prefer card view'), Languages (owner comment of 2026-11-21, docs/v9/STRATEGY.md section Your comments of 2026-11-21): English and German complete, Spanish, French and Simplified Chinese in the switch marked 'beta' with a link to the catalogue file in the public repository until a native speaker has read them. Contract: docs/v9/ARCHITECTURE.md sections Room model (Settings: deck, auto reveal, reveal countdown, timer; every player may change them; a spectator may not) and Client (storage keys profile and prefs under fpp:v9:, each value with a schema version).
      what: |-
        apps/room/src/features/settings/ with its registration line and message file; the catalogue configuration (the locales es, fr and zh-Hans registered with fallback to English); packages/room-core and docs/v9/protocol.md only for a missing room setting; the prefs schema in @fpp/room-client only for haptics; end-to-end and component tests.
      change: |-
        1. Read room.setSettings in docs/v9/protocol.md and the decks in packages/room-core: Fibonacci 1 2 3 5 8 13 21 as in v1 (the default), modified Fibonacci, T-shirt with XS 1, S 2, M 3, L 5, XL 8, XXL 13, powers of two, custom values, with '?' (abstain) and a break card available in each.
        2. Room sections, each a command any player sends and every seat sees at once; a spectator sees them read-only: the deck with custom values (decide the limits on count and label length from the deck schema and record them), auto reveal, the reveal countdown, the timer (off, 30, 60, 120 seconds), and reactions for everyone. The switch for reactions is not among the settings ARCHITECTURE.md lists: if room-core lacks it, add it additively following the rule for a protocol change, and correct section Room model's Settings line in the same pull request.
        3. Profile (local, key profile): the name (the room-core name rule; a change sends seat.rename for the own seat) and the avatar seed with a re-roll. The avatar is drawn from its seed by the table: use what @fpp/table exports through apps/room/src/table-entry.ts; if it exports nothing, decide and record. If the protocol has no command that changes an avatar while seated, a re-roll applies from the next join and the section says so.
        4. Personal preferences (local, key prefs, through basalt-ui's persisted): sound, off for new users (a v1 user with isPlaySound on keeps it: @fpp/room-client adopts it); calm mode, which turns off reactions, confetti, sound and streaks; haptics, which ARCHITECTURE.md's prefs list lacks: add it to the prefs value with its schema version raised, and correct section Client; the view (automatic, Table, Grid); the theme, reusing the shell's switch so there is one control and one stored value.
        5. All of these reach the table as preferences through apps/room/src/table-entry.ts; reduced motion is the system setting or calm mode.
        6. The language switch: English, Deutsch, Español, Français, 简体中文, each in its own language. The last three carry a 'beta' mark and a link to their catalogue file in the public repository on GitHub, built from one constant. The choice is stored in prefs.language and applied without a reload; no URL carries it. Register es, fr and zh-Hans in the catalogue with fallback to English per key; the message check keeps enforcing English and German only.
        7. Conventions of every room row: the code lives in one feature directory, apps/room/src/features/settings/, plus its one registration line in apps/room/src/features/index.ts and its message file; nothing else in a shared file changes, except a missing room setting in packages/room-core and haptics in the prefs schema of @fpp/room-client. Every visible string, accessible names and placeholders included, comes from the message catalogue, with English and German complete in this pull request (Spanish, French and Simplified Chinese fall back to English until v9-room-translations). The test ids of e2e/TESTIDS.md stay; new ones are added to that file. The pull request extends the end-to-end suite and the component tests for what it adds and attaches the screenshots make ui-shots writes for the states it touched. basalt-ui components and tokens only: a missing piece is filed with factory issue new --repo basalt-ui and named in the pull request, never patched here; basalt-ui's design reviewer runs before review is asked for. The table is @fpp/table, mounted through apps/room/src/table-entry.ts; this row never reaches into it.
      acceptance: |-
        - An end-to-end test: seat A switches the deck to T-shirt and seat B's hand shows XS to XXL; a custom deck of 1, 2, 4, 8 and '?' plays a round.
        - An end-to-end test: a spectator cannot change a room setting (no control, and a command sent anyway is refused).
        - A component test: a new device has sound off; a v1 localStorage fixture with isPlaySound true has sound on.
        - A component test: switching to Deutsch changes every string without a reload and the URL stays the same; choosing Español shows the beta mark and the link, and a key missing in Spanish shows its English text.
        - A component test reads the preferences the table entry receives and finds calm mode, sound, haptics, view and reduced motion as set.
        - make ui-shots STATES='settings*' writes every section at 360 and 1280 px, light and dark, in German and in the pseudo-locale.
        - make check passes.
      scope: |-
        Not the lock or the password (v9-room-access), the address or the display name (v9-room-address). The sounds, the haptic tick, reactions and the streak themselves are v9-table-feel's. The Spanish, French and Chinese texts are v9-room-translations'.

  - key: v9-room-access
    title: 'Inviting and the lock: the Invite button and panel with the share sheet, the invitation at the centre of an empty table, locking with a typed or generated password, and the locked room''s screen'
    kind: feature
    prio: 1
    seat: {role: lead}
    lane: ui
    after: [v9-room-shell]
    after_needs: shipped
    facts:
      why: |-
        Sharing a room must take one click, and a locked room must be as easy to share as an open one (owner rulings of 2026-11-20). Behaviour: docs/v9/UX.md sections Flows (First visit, Inviting, A locked room). Contract: docs/v9/ARCHITECTURE.md invariants 2, 10, 11 and 14, section Room model (the paragraph The lock keeps strangers out), section Protocol (close code 4005, the limits), section HTTP API (PUT /rooms/:slug/access), section Client. Research: docs/v9/research/r22-invite-links-room-names.md (the fragment never reaches a server, but page scripts and link scanners that run JavaScript can read it; join only after an explicit action). Two owner comments of 2026-11-21 shaped this row (docs/v9/STRATEGY.md section Your comments of 2026-11-21): there is no QR code anywhere (the Invite panel copies the link and offers the system share sheet), and the password rule below.
      what: |-
        apps/room/src/features/access/ with its registration line and message file; the AccessCode value object in packages/room-core and the check in apps/api's PUT /api/rooms/:slug/access, both only where they do not follow the password rule yet; end-to-end and component tests.
      change: |-
        1. The password rule (docs/v9/ARCHITECTURE.md section Room model, the paragraph The lock keeps strangers out). A typed password is trimmed of surrounding white space and then has 2 to 32 characters, any visible characters. A generated one is six characters from the 31 unambiguous lower-case letters and digits (make the alphabet v9-api-persistence put in packages/room-core lower-case if it is not). Typed and generated passwords are compared after Unicode NFKC normalisation and case-insensitively, on the server by the one function in room-core. The rows v9-room-runtime and v9-api-persistence were written with this rule: check that AccessCode and the API's validation follow it, and fix them in this pull request where they do not.
        2. The link is /room/<slug>#<encodeURIComponent(password)>; nothing is base64. On start the client reads location.hash once, drops the '#' and decodes it with decodeURIComponent; a malformed escape counts as no password and shows the field. It goes to @fpp/room-client, which sends it in hello and keeps it with the room in recent (check that the client decodes the same way; fix it there if not). Whether the fragment is then removed from the address bar the documents do not say: decide and record it.
        3. The Invite button in the header's invite slot copies the link at once (with the fragment when the room is locked), says so, and opens a small panel: the link with a copy button, a share button where navigator.share exists, and in a locked room the password large enough to read aloud. While a person is alone, the same invitation is the centre of the table area: if the table's contract has a slot for centre content, use it; else overlay it in the shell's table container and record the gap for the table. Event invite_copied, with no link or code in it.
        4. Locking, in a settings section: type a password or take a generated one; before the field, the sentence that everyone at the table can see it, so nobody types one used elsewhere. PUT /api/rooms/:slug/access with the seat secret in the Authorization header. When locking or changing the password, the player chooses whether the people already seated stay; 'everyone enters again' raises access_epoch, which closes the other seats with 4004. Unlock and change are in the same section; every seat sees the current password there and in the Invite panel. Event room_locked (typed or generated).
        5. The status locked (close code 4005) replaces the shell's placeholder: the table hidden behind one field, and neither the display name nor who is present shown. A wrong password says so and nothing else. After ten wrong attempts within a minute on the room, or five from one address, further attempts are refused for a minute and the screen says when to try again (read in protocol.md how the refusal arrives). A remembered password that no longer fits shows the same screen.
        6. Conventions of every room row: the code lives in one feature directory, apps/room/src/features/access/, plus its one registration line in apps/room/src/features/index.ts and its message file; nothing else in a shared file changes, except the password rule in packages/room-core and apps/api (step 1). Every visible string, accessible names and placeholders included, comes from the message catalogue, with English and German complete in this pull request (Spanish, French and Simplified Chinese fall back to English until v9-room-translations). The test ids of e2e/TESTIDS.md stay; new ones are added to that file. The pull request extends the end-to-end suite and the component tests for what it adds and attaches the screenshots make ui-shots writes for the states it touched. basalt-ui components and tokens only: a missing piece is filed with factory issue new --repo basalt-ui and named in the pull request, never patched here; basalt-ui's design reviewer runs before review is asked for. The table is @fpp/table, mounted through apps/room/src/table-entry.ts; this row never reaches into it.
      acceptance: |-
        - An end-to-end round trip: a room locked with the password 'Tür #1 中' gives an invite link whose fragment is encodeURIComponent of it; a fresh browser context opening that link is seated without a prompt.
        - Tests of the rule: '  ab  ' is stored as 'ab'; 'a' and 33 characters are refused; a room locked with 'abc' opens with 'ABC' and with the full-width 'ＡＢＣ'; 1,000 generated passwords each have six characters from the alphabet.
        - An end-to-end test: the bare room link in a third context shows the field, and its DOM holds neither the display name nor a seat name; a wrong password shows only the wrong-password message; the right one seats it, and after a reload it is not asked again.
        - An end-to-end test: 'everyone enters again' closes the other seats, which land on the locked screen.
        - A test with a marker password asserts that no request URL (fetch, WebSocket, beacon), no call of the track facade and no browser log carries it.
        - make ui-shots STATES='access*' writes the Invite panel open and locked, the invitation of an empty table, the lock section, and the locked screen with a wrong password and refused, at 360 and 1280 px, light and dark.
        - make check passes.
      scope: |-
        Not booking a name or the changed-hands screen (v9-room-address). Whether the fragment survives Teams and Outlook is tested by the owner in v9-room-verdict. The landing page's 'Start planning' is the site's (stage 3); the first copy from /room is v9-room-home's.

  - key: v9-room-address
    title: 'Numbers and names in the room: booking and changing a name with a live answer, the display name, the notice before a hold ends, and the screen for an address that changed hands'
    kind: feature
    prio: 1
    seat: {role: lead}
    lane: ui
    after: [v9-room-shell]
    after_needs: shipped
    facts:
      why: |-
        A team that comes back books a name; numbers and names nobody uses return to the pool, and a device must never seat its owner at a stranger's table without saying so (owner rulings of 2026-11-20). Behaviour: docs/v9/UX.md section The room (third paragraph) and Flows (Coming back: the changed-hands notice, the tab title). Contract: docs/v9/ARCHITECTURE.md invariant 17, section Room model (the paragraphs and table on numbers and names), section HTTP API (GET /rooms/:slug, PUT /rooms/:slug/name), section Client (the figure diagrams/entry.svg).
      what: |-
        apps/room/src/features/address/ with its registration line and message file; apps/api/src/http only if GET /api/rooms/:slug lacks the release date (step 5); end-to-end and component tests.
      change: |-
        1. Read GET /api/rooms/:slug (free, held or released; the access mode; the creation time) and PUT /api/rooms/:slug/name as v9-api-persistence built them, and the Slug parser in packages/room-core.
        2. A settings section 'Room address': the number, and the name if one is booked. Booking: one field checked as the person types against the rule (3 to 30 characters of a to z, 0 to 9 and the hyphen, with at least one letter) and, debounced, against GET: free or released means it can be booked, held by another room means taken, held by this room means it is already this room's. Booking sends PUT with the seat secret in the Authorization header; a 409 says taken. On success the URL becomes /room/<name> with its fragment kept, recent is updated, and every seat hears of it. Changing a name works the same, with the notice that the old address keeps leading here for 30 days.
        3. An address that is not the room's primary one answers with the primary one: replace the URL with history.replaceState, keep the fragment, update recent (check whether the plain room already does this).
        4. The display name (room.setTitle): shown in the header and the browser tab, editable by any player, with the length limit of protocol.md.
        5. The hold: a number is held three months after the room's last visit, a name six, and each visit renews it at most once a day. The section says until when the address is held and offers to book a name. ARCHITECTURE.md does not have GET report that date: if it does not, add releaseAt (a date only) to its response in apps/api with a test. Because opening a room renews its hold, the notice that a hold is about to end can only reach someone who opens a room after a long pause: show it when the release date GET reports before this visit lies within a window you decide, and record it.
        6. The status changed-hands replaces the shell's placeholder, before anyone is seated: the address now leads to a different room than the one this device visited (with the date it remembers). Two choices: open the new room (the recent entry is replaced and its stored password dropped) or go to /room.
        7. Conventions of every room row: the code lives in one feature directory, apps/room/src/features/address/, plus its one registration line in apps/room/src/features/index.ts and its message file; nothing else in a shared file changes, except releaseAt in apps/api (step 5). Every visible string, accessible names and placeholders included, comes from the message catalogue, with English and German complete in this pull request (Spanish, French and Simplified Chinese fall back to English until v9-room-translations). The test ids of e2e/TESTIDS.md stay; new ones are added to that file. The pull request extends the end-to-end suite and the component tests for what it adds and attaches the screenshots make ui-shots writes for the states it touched. basalt-ui components and tokens only: a missing piece is filed with factory issue new --repo basalt-ui and named in the pull request, never patched here; basalt-ui's design reviewer runs before review is asked for. The table is @fpp/table, mounted through apps/room/src/table-entry.ts; this row never reaches into it.
      acceptance: |-
        - An end-to-end test: seat A books team-alpha; both seats' URLs become /room/team-alpha; the old number still opens the room; a second room's attempt at team-alpha shows it as taken.
        - A component test with a fake API: ab, 123456 and Team_Alpha are refused by the rule; free, released, held by another room and held by this room each give their answer.
        - A test: a device that remembers a room created at one time opens the address now leading to a room created at another and sees the changed-hands screen with no WebSocket opened.
        - A component test: a release date inside the window shows the notice with the offer to book a name; one outside shows none.
        - An end-to-end test: a new display name appears in the header and the tab title of both seats.
        - make ui-shots STATES='address*' writes the section free, taken and booked, the notice and the changed-hands screen, at 360 and 1280 px, light and dark.
        - make check passes.
      scope: |-
        Not the lock (v9-room-access) and not the list of recent rooms or the switcher (v9-room-home). The server's rules for names and holds are v9-api-persistence's and do not change here.

  - key: v9-room-home
    title: '/room as the way back: the rooms this device visited with live head counts, pin and remove, create a room and join by link, number or name, and the room switcher in the header'
    kind: feature
    prio: 1
    seat: {role: lead}
    lane: ui
    after: [v9-room-shell]
    after_needs: shipped
    facts:
      why: |-
        Coming back must be two clicks, and the home page must never jump into a room by itself (UX.md table What changes for a v1 user: v1's jump into the last room is dropped). Behaviour: docs/v9/UX.md sections Flows (Coming back; First visit: the first click also copies the invite link where the browser allows it). Contract: docs/v9/ARCHITECTURE.md section Client (the storage key recent: address, display name, creation time, the password of a locked room, pinned or not; an unpinned room dropped after six months without a visit) and section HTTP API (POST /rooms; GET /rooms/:slug: display name and seat counts only for an open room).
      what: |-
        apps/room/src/features/home/ (the route /room through the registry's route contribution, the switcher in the header's switcher slot) with its registration line and message file; the storage module of @fpp/room-client only if it does not prune recent; end-to-end and component tests.
      change: |-
        1. /room replaces the plain room's page: the rooms of recent, pinned ones first, then by last visit, newest first. Each shows its display name (stored; refreshed from GET for an open room), its address, and for an open room the people in it now (players and spectators from GET /api/rooms/:slug, fetched in parallel; decide a limit on concurrent requests). A locked room shows a lock and no count. An address that GET reports free, or whose creation time differs from the stored one, is marked as such.
        2. Pin and unpin; remove, with an undo. An unpinned entry is dropped after six months without a visit: if @fpp/room-client's storage does not do it, add it there with a test on a fake clock.
        3. Create: 'Start planning' calls POST /api/rooms and opens /room/<number>. An optional field beside it books a name with the creation (POST /api/rooms takes one; the rule and the live answer are v9-room-address's, reused through packages/room-core's Slug parser and GET /api/rooms/:slug). The click also copies the invite link where the browser allows it: the link is known only after the request returns, so decide how (a clipboard item written with a pending value, or a copy offered once seated) and record it. Event room_created.
        4. Join: one field takes a link (any URL whose path is /room/<slug>; its fragment is kept), a number (six or eight digits, spaces removed) or a name, checked by the Slug parser of packages/room-core; an address GET reports free says there is no room there and offers to create one.
        5. An empty list shows the first action. Nothing on /room or anywhere else opens a room without the person's click.
        6. The switcher: the same list in the header's switcher slot, the current room marked, so moving between two rooms takes two clicks.
        7. Conventions of every room row: the code lives in one feature directory, apps/room/src/features/home/, plus its one registration line in apps/room/src/features/index.ts and its message file; nothing else in a shared file changes, except pruning in @fpp/room-client (step 2). Every visible string, accessible names and placeholders included, comes from the message catalogue, with English and German complete in this pull request (Spanish, French and Simplified Chinese fall back to English until v9-room-translations). The test ids of e2e/TESTIDS.md stay; new ones are added to that file. The pull request extends the end-to-end suite and the component tests for what it adds and attaches the screenshots make ui-shots writes for the states it touched. basalt-ui components and tokens only: a missing piece is filed with factory issue new --repo basalt-ui and named in the pull request, never patched here; basalt-ui's design reviewer runs before review is asked for. The table is @fpp/table, mounted through apps/room/src/table-entry.ts; this row never reaches into it.
      acceptance: |-
        - An end-to-end test: after visiting two rooms, /room lists both, newest first, and the head count of the open one changes when a second context joins it.
        - An end-to-end test: pin moves a room to the top; remove takes it off and undo brings it back.
        - An end-to-end test: joining by a full link with a fragment, by a number with a space in it and by a booked name each open the right room.
        - A test: /room never navigates on its own, with or without recent rooms, and with a v1 recentRoom adopted by @fpp/room-client.
        - A test with a fake clock: an unpinned entry seven months old is dropped, a pinned one is kept.
        - A test: the switcher reaches the other room in two clicks.
        - make ui-shots STATES='home*' writes the empty page, a list with open, locked and changed rooms, and the switcher, at 360 and 1280 px, light and dark.
        - make check passes.
      scope: |-
        The landing page's 'Back to …' and 'Join a room' are the site's (stage 3). The offline list is v9-room-pwa's. Booking a name and the hold notice are v9-room-address's.

  - key: v9-room-topics
    title: 'The topic queue: type, paste a list or drop a tracker''s CSV export, ticket references as links, reorder, rename and remove up to 200 topics, final values shown and corrected in the list'
    kind: feature
    prio: 1
    seat: {role: lead}
    lane: ui
    after: [v9-room-shell]
    after_needs: shipped
    facts:
      why: |-
        The topic is the unit of estimation (invariant 13), and a pasted ticket keeps its tracker reference so a result can find its way back later, which every integration after launch relies on. Behaviour: docs/v9/UX.md sections Decks and facilitation (Topics) and Flows (Disagreement: the final value shows in the topic list and can be corrected there). Contract: docs/v9/ARCHITECTURE.md sections Room model (Topic, Final value; the queue holds at most 200; moving on marks an undecided topic done, or skipped if it never had a reveal), Data model (the tracker reference: source, stable id, key, site) and Protocol (the topic commands); the paste parser in packages/room-core (v9-room-core).
      what: |-
        apps/room/src/features/topics/ (a panel) with its registration line and message file; a CSV reader in packages/room-core beside the paste parser, with fixtures; end-to-end and component tests.
      change: |-
        1. The panel lists every topic with its state (queued, active, done, skipped), its title, its reference as a link labelled with its key, and its final value, or the words that it has none.
        2. Adding: one field, Enter adds a topic. A pasted block of several lines goes through the paste parser of packages/room-core, one topic per line (a leading ticket key such as 'SHOP-123 Checkout redesign', a tracker link, or plain text), each sent as topic.add (read in protocol.md whether one command can carry several). The panel says how many of the 200 places are left and refuses what goes beyond, saying so.
        3. A tracker's CSV export, dropped on the panel or chosen with a file button for keyboard users: read in the browser by a CSV reader written as pure code in packages/room-core next to the paste parser, so the embedded room and the later topics route reuse it. The documents name no columns: take real exports of Jira, Linear, GitHub and Azure DevOps (their documentation or a sample), decide the header mapping to title, key, stable id and link, put a fixture of each beside the tests, and record the mapping. No CSV library unless you record its size and why. A preview shows the count and the first lines before anything is added.
        4. Reorder by drag and by keyboard (topic.move), rename in place (topic.update), remove (topic.remove), each as the reducer allows for the topic's state.
        5. Correcting a final value: for a topic with a revealed round, choose one of the deck's cards and send poker.settle naming that topic (read in protocol.md how a topic other than the active one is named). Every seat sees the change at once.
        6. A reference opens in a new tab with rel noopener noreferrer.
        7. Conventions of every room row: the code lives in one feature directory, apps/room/src/features/topics/, plus its one registration line in apps/room/src/features/index.ts and its message file; nothing else in a shared file changes, except the CSV reader in packages/room-core (step 3). Every visible string, accessible names and placeholders included, comes from the message catalogue, with English and German complete in this pull request (Spanish, French and Simplified Chinese fall back to English until v9-room-translations). The test ids of e2e/TESTIDS.md stay; new ones are added to that file. The pull request extends the end-to-end suite and the component tests for what it adds and attaches the screenshots make ui-shots writes for the states it touched. basalt-ui components and tokens only: a missing piece is filed with factory issue new --repo basalt-ui and named in the pull request, never patched here; basalt-ui's design reviewer runs before review is asked for. The table is @fpp/table, mounted through apps/room/src/table-entry.ts; this row never reaches into it.
      acceptance: |-
        - An end-to-end test: pasting three lines (a ticket key line, a Jira issue link, plain text) adds three topics in order; the first two show their key as a link.
        - Tests of the CSV reader: each fixture (Jira, Linear, GitHub, Azure DevOps) yields the expected titles, keys, ids and links; quoted fields with commas and line breaks are read correctly.
        - A test: with 199 topics, a paste of three lines adds one and says that two did not fit.
        - An end-to-end test: a topic is moved by keyboard and the order changes for every seat; a rename and a removal reach every seat.
        - An end-to-end test: a done topic's final value corrected in the list shows the new value on every seat and after a reload.
        - make ui-shots STATES='topics*' writes the empty queue, five topics in every state, 200 topics, and the CSV preview, at 360 and 1280 px, light and dark.
        - make check passes.
      scope: |-
        Not the session summary or its export (v9-room-summary). The route that lets an automation fill a queue comes after launch. The active topic in the round bar is v9-room-round's.

  - key: v9-room-summary
    title: 'The session summary: every topic with its final value, spread, rounds and duration, copied as Markdown and exported as CSV through the API summary route'
