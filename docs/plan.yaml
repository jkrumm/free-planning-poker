  - key: v9-budgets
    title: 'Budgets as CI gates: size-limit on the room''s entry and on the site''s page JavaScript, Lighthouse lab runs on the site and the room shell, each proven by a planted regression'
    kind: chore
    prio: 1
    seat: {role: lead}
    lane: browser
    after: [v9-site-landing, v9-room-polish]
    after_needs: shipped
    facts:
      why: |-
        The speed targets are numbers in the documents and partial checks in single rows; this row turns each into a gate that fails the pull request which breaks it and prints the number. Contract: docs/v9/ENGINEERING.md section Targets (room entry JavaScript at most 180 kB gzip, size-limit in CI) and section CI (size-limit after make check in the job check; the job site checks the page budgets); docs/v9/UX.md section Being found, row Speed (the thresholds for real visits: LCP 2.5 s, INP 200 ms, CLS 0.1); docs/v9/ARCHITECTURE.md section Testing, row Budgets (the lab budget: LCP at most 2.0 s on the landing page and the room shell). It runs after the landing page and the polished room, so it measures what ships.
      what: |-
        The size-limit configuration (the file the tool reads, at the root or per app: decide), the Lighthouse CI configuration with its assertions, a Makefile target budgets, the jobs check and site of .github/workflows/ci.yml, docs/v9/evidence/budgets.md, and docs/v9/ENGINEERING.md section Targets and docs/v9/ARCHITECTURE.md section Testing where their numbers change.
      change: |-
        1. First read what exists: v9-room-plain recorded the entry size, v9-site-look added a test of 12 kB of page JavaScript outside islands, v9-site-landing a Lighthouse run on the landing page in CI. Fold them into this row's one mechanism rather than running a second copy; remove an old check only where the new gate covers it, and say which in the pull request.
        2. If a budget is already broken on master, do not turn it into a gate that turns master red: file the fix with factory issue new (the number, the file, the limit), defer this Issue until that Issue closes with factory issue defer, and end the turn.
        3. size-limit (pinned exactly, version checked with agw web package npm size-limit, with its preset for built files): the room's entry in apps/room/dist (the shell and every chunk loaded before the first seat renders; decide which chunks count and record) at most 180 kB gzip; on every built page of apps/site the JavaScript that is not an island at most 12 kB gzip. Decide whether Umami's script (about 4 kB, served by Umami under /api/u, not part of the build) counts, and record. The output names each file, its gzip size and its limit.
        4. Lighthouse CI (@lhci/cli, pinned exactly, version checked with agw web package npm @lhci/cli) in its lab profile (record the device and throttling it uses) against the built site served statically (/, /guide and one content page) and the room shell served by the built API image with deploy/compose.yml, as the end-to-end suite starts it (/room and /room/ followed by a fresh slug). Assertions: LCP at most 2.0 s (the lab budget of docs/v9/ARCHITECTURE.md section Testing, row Budgets; 2.5 s in docs/v9/UX.md is the threshold for real visits, which a lab run must beat), CLS at most 0.1, and total blocking time at most a bound you derive for INP 200 ms, since a lab run measures no INP; the bound and its reasoning go into docs/v9/evidence/budgets.md. Decide the number of runs per URL and assert on the median; record.
        5. Each budget fails the job that runs it and prints the measured number beside the limit, and the gate job ci fails with it. make budgets runs the same locally inside factory slot run; Lighthouse needs Chromium, which is why this row is in the lane browser.
        6. A planted regression proves each budget: a large import in the room's entry, a script outside an island on one page, an element that moves after load, a long task in the room shell's first render. Each on a scratch branch, each failing run's output quoted in the pull request, none merged.
        7. docs/v9/evidence/budgets.md holds every budget's current number and headroom and the TBT bound with its reason. docs/v9/ARCHITECTURE.md section Testing, row Budgets, gains the 12 kB number and the TBT bound in the same pull request.
      acceptance: |-
        - make budgets exits 0 on master and prints every budget with its number and its limit.
        - Each of the four planted regressions makes the job ci fail and prints the number; the four run ids are in the pull request.
        - The room entry is at most 180 kB gzip and every site page's JavaScript outside islands at most 12 kB gzip; the numbers are in docs/v9/evidence/budgets.md.
        - The Lighthouse medians of every URL of step 4: LCP at most 2.0 s, CLS at most 0.1, TBT within the recorded bound.
        - The time the budgets add to CI on a pull request is in the pull request, and the median stays inside docs/v9/ENGINEERING.md section Targets (8 min).
        - make check passes.
      scope: |-
        No optimisation of the room or the site: a breach is fixed by its own Issue (step 2). No field measurement and no web vitals sent from browsers (docs/v9/ARCHITECTURE.md section Measurement). No change to the end-to-end suite or the screenshots.

