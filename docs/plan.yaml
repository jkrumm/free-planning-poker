        2. List the rows with no Issue yet (factory project plan free-planning-poker --format plain). For each, compare its facts with what was built and edit only the facts that no longer hold: a path, a name, a column, a variable. Do not rewrite, add or remove a row; change no seat, gate, lane or after edge.
        3. For a stage 3 row whose Issue is already open, put the corrected fact on that Issue with factory issue note, with its source.
        4. The evidence file records every change: the row, the old text, the new text, and the source (pull request number and file:line). If nothing needs changing, it says so and lists the rows checked.
        5. docs/v9/PLAN.md section Stage 3 changes only where a row's draft line changed.
      acceptance: |-
        - factory plan check docs/plan.yaml exits 0.
        - git diff --stat of the pull request lists only docs/plan.yaml, docs/v9/PLAN.md and docs/v9/evidence/plan-site.md.
        - Every edit in docs/plan.yaml has a line in the evidence file with its source.
        - The diff changes no seat, checkpoint, lane or after line.
        - make check passes.
      scope: |-
        No code. No new or removed row. No row of stage 2 or stage 4.

  - key: v9-api-read
    title: 'A room''s history over HTTP: GET /api/rooms/:slug/topics and /summary as JSON, CSV and Markdown, for a seat of that room, typed with Eden'
    kind: feature
    prio: 1
    seat: {role: lead}
    after: [v9-plan-site]
    after_needs: shipped
    facts:
      why: |-
        docs/v9/ARCHITECTURE.md sections HTTP API (history and results as JSON, CSV and Markdown; proof: a seat of that room; seat secrets travel in the Authorization header), Built for what comes next (the result contract; every tracker takes results out as CSV) and Data model (topic, round, round_vote; no participant names in history); invariant 15 (one result contract). docs/v9/UX.md section Flows, paragraph Ending a session: the summary lists every topic with its final value, spread, number of rounds and duration, with copy as Markdown and export as CSV; a topic without a final value shows its most common card, marked as open. v9-room-summary and v9-room-insights wait for this row.
      what: |-
        apps/api/src/http (the two routes and their serializers, Eden types exported), apps/api/src/db (read queries as plain functions beside v9-db-schema's repositories), apps/api/test.
      change: |-
        1. GET /api/rooms/:slug/topics: every topic of the room in queue order with its state, final label and value, how it was decided, and its rounds (no, attempt, deck, revealed at, voters, spectators, distribution, consensus, auto reveal). Each round and each decided topic is built by packages/room-core's builders for poker.revealed and topic.decided, never by hand. Rounds imported from v1 hold only the summary v1 kept (average, lowest, highest, count) and no distribution: represent them by an optional field, additive under invariant 7 and consistent with what v9-importer stores; record.
        2. GET /api/rooms/:slug/summary: per topic the final value, or the most common card marked as open, the spread, the number of rounds and the duration; then the room's totals.
        3. Formats: JSON by default; CSV and Markdown chosen by the Accept header (text/csv, text/markdown) or by a query parameter: decide one and record. CSV is the flat form of the result contract, one line per round, with the column names listed in the pull request, quoted per RFC 4180, and a cell that starts with =, +, - or @ escaped so a spreadsheet does not run it. Markdown is one table for the summary.
        4. Proof: the seat secret of that room in the Authorization header, read as the PUT routes of v9-api-persistence read it. Without it a typed 401; another room's seat, a kicked seat, or a seat voided by a raised access_epoch a typed 403. The slug resolves every address of the room (number, name, a replaced name within its 30 days) as GET /api/rooms/:slug does.
        5. No participant name and no single seat's vote leave by either route: distributions only, as the result contract carries them.
        6. A room holds at most 200 topics (docs/v9/UX.md section Decks and facilitation, paragraph Topics). Measure the answer time with 200 topics and 1,000 rounds and record it; add paging only if that number calls for it.
      acceptance: |-
        - A test: after three rounds on two topics, one of them decided, JSON lists both topics with their rounds in the result contract's shape, CSV holds three data lines under the documented header, and Markdown renders the summary.
        - A test: no header gives a typed 401; another room's seat and a voided seat a typed 403.
        - A content test with a marker display name finds the marker in none of the three formats, and no single vote by seat.
        - A test: a topic title starting with = is escaped in CSV.
        - A fixture round with origin v1 renders as a summary without a distribution.
        - make check passes.
      scope: |-
        No screen (v9-room-summary, v9-room-insights). No POST route for topics (after launch). No webhooks.

  - key: v9-api-contact
    title: 'POST /api/contact and POST /api/feedback on the new API, with v1''s fields, limits and upstreams, and their secrets kept out of the repository'
    kind: feature
    prio: 1
    seat: {role: lead}
    after: [v9-plan-site]
    after_needs: shipped
    facts:
      why: |-
        docs/v9/ARCHITECTURE.md section HTTP API: POST /contact goes to the mail gateway and POST /feedback to the factory's door, with v1's limits. In v1 the contact form is a tRPC route of apps/web and the feedback a route of apps/server; on one origin both become routes of apps/api. The page /contact (v9-site-legal) and the room's feedback form post here.
      what: |-
        apps/api/src/http (the two routes), apps/api/src/app (their configuration), apps/api/.env.tpl (the variable names with local dummies only, as every template of this repo), apps/api/test.
      change: |-
        1. Read v1 before writing: git show origin/v1:apps/web/src/server/api/routers/contact.router.ts (fields: name optional up to 50, e-mail required and valid up to 70, subject 3 to 100, message optional up to 800; a POST to the gateway's /fpp path with a bearer secret and a 7 s timeout; behind the feature flag CONTACT_FORM), origin/v1:apps/web/src/env.js and origin/v1:apps/web/.env.tpl (EMAIL_GATEWAY_URL, EMAIL_GATEWAY_SECRET_KEY), origin/v1:apps/server/src/feedback.ts, origin/v1:apps/server/src/index.ts and origin/v1:packages/shared/src/feedback.ts (title up to 200, text up to 2000, version up to 64, route up to 256; three submissions per client and 30 overall in a sliding 10 minutes, then a 429 with retry-after; a 5 s timeout; FACTORY_FEEDBACK_URL and FACTORY_FEEDBACK_TOKEN; the client key from the first X-Forwarded-For hop; an origin allowlist).
        2. Keep the fields, limits, upstream calls and timeouts. Decide whether contact gets the same rate limit as feedback (v1 had none) and record. Site and room share one origin now: check the Origin header against that origin instead of answering CORS, and record the rule for local hosts.
        3. v1's feature flag becomes configuration: a route whose upstream variables are unset answers a typed 503, which is the default for self-hosting.
        4. Business errors are typed: 400 per field, 429 with retry-after, 503 when off, 502 when the upstream fails. The upstream failure is recorded with recordError (component and action), never with the message text, the e-mail address or the subject.
        5. Secrets: production values through the secret mechanism of the vps repository's fpp-api environment, never in a file of this repository. The feedback variables are there since v9-vps-next; the two gateway variables are not: file that change as an Issue in vps (factory issue new --repo vps) and link it in the pull request.
        6. Tests replace both upstreams by servers on ports the operating system chooses, and assert the request each receives, its authorisation header, the timeout and the limits.
      acceptance: |-
        - A test: a valid contact and a valid feedback reach their fake upstream with the expected body and header.
        - A test: the fourth feedback of one client within 10 minutes answers 429 with retry-after; each field limit answers a typed 400.
        - A test: with the variables unset both routes answer 503.
        - A content test finds no message text, e-mail address or subject in any exported span, log body or attribute.
        - After the deploy and the vps change, one contact submission on the beta host reaches the gateway (noted in the pull request).
        - make check passes.
      scope: |-
        No form (v9-site-legal and the room's feedback). No change to the mail gateway or the factory's door.

  - key: v9-stats-rollups
    title: 'Rollups behind the public numbers: a daily job that fills stat_daily from rounds and estimating days, and a cached GET /api/stats with the week-over-week comparison by working days'
    kind: feature
    prio: 1
    seat: {role: lead}
    after: [v9-plan-site]
    after_needs: shipped
    facts:
      why: |-
        docs/v9/ARCHITECTURE.md sections Data model (stat_daily: day, metric, dimension, value, continuous with v1's history; visitor_day kept 13 months), Measurement (How do rooms behave: Postgres), HTTP API (GET /stats, public rollups, cached) and Repo map (Effect in src/jobs). docs/v9/research/r13-analytics-engine.md: plain Postgres rollups; fix the day boundary, the bucket edges and the value encoding now; define the stats contract and its cache headers. docs/v9/UX.md section Insights lists what the public page shows. The old backlog asks to compare a week with the previous one over the same number of working days (docs/v9/PLAN.md section The old backlog, mapped). v9-importer and v9-site-stats build on the metric names chosen here.
      what: |-
        apps/api/src/jobs (the rollup job, Effect), apps/api/src/db (rollup queries), apps/api/src/http (GET /api/stats with its Eden type), one file that names every metric, apps/api/test.
      change: |-
        1. One file names every metric: its name, what its dimension holds, its unit. Days are UTC dates. It covers what the page shows: rounds, votes, rooms opened and created, estimators per day and new estimators (from visitor_day), card popularity per deck and label (from round distributions), consensus rounds, and rounds by weekday and hour for when the world estimates. It leaves room for the legacy metrics v9-importer brings (v1's page views and events). Record the list.
        2. The job, an Effect program in apps/api/src/jobs, computes a whole day from topic, round and visitor_day and replaces that day's rows in one transaction, so running a day twice changes nothing. On start it fills missing days; then it runs every hour for today and once after midnight UTC for yesterday. While two API containers overlap during a handoff only one runs it (an advisory lock).
        3. Week over week by working days: the current week up to today against the previous week over the same number of working days, Monday to Friday in UTC (on a Wednesday, Monday to Wednesday against the previous Monday to Wednesday). Public holidays are not considered; record.
        4. GET /api/stats answers the totals, rounds per week for the last 52 weeks, card popularity, the consensus rate, the 168 cells of weekday by hour, tables open right now, and the week-over-week figures, with a version field and the time it was computed. Tables open right now comes from the running rooms, not from the rollups; decide how it is counted while two containers overlap, and record. Cached in process and with a public Cache-Control (decide the age, record).
      acceptance: |-
        - A test seeds ten days of rounds and votes and finds stat_daily equal to a hand-computed fixture; running each day twice leaves every row unchanged.
        - A test: on a Wednesday the comparison spans Monday to Wednesday of both weeks; on a Monday, one day of each.
        - A test: GET /api/stats carries the documented fields and Cache-Control, and a second call within the age is answered from the cache.
        - A test with two job runners on one database: one run per tick.
        - The answer time over a year of seeded rollups is in the pull request.
        - make check passes.
      scope: |-
        No page (v9-site-stats). No import of v1 (v9-importer). No Umami data in the rollups.

  - key: v9-importer
    title: 'The one-time import of v1''s MariaDB into Postgres: rooms with their numbers and names, rounds as summaries, daily counts and estimating days, with a dry run and a rehearsal on a real dump'
    kind: feature
    prio: 1
    seat: {tier: opus, effort: high}
    after: [v9-stats-rollups]
    after_needs: shipped
    facts:
      why: |-
        docs/v9/ARCHITECTURE.md sections Data model (paragraph What comes over from v1) and Cutover (step 2: the importer runs against a fresh production dump after one run on a real dump before), docs/v9/STRATEGY.md section Numbers and history (everything about estimating is kept), and the owner's ruling that bookmarked room links keep working. An opus seat because it moves the meaning of five years of data once, and the cutover cannot repeat it.
      what: |-
        apps/api/src/jobs/import-v1 (the command; Effect is allowed there), a reader for v1's MariaDB, the Makefile target import-v1 with a scratch MariaDB started through a Makefile target, apps/api/test/import with a synthetic fixture dump, docs/v9/evidence/import-rehearsal.md.
      change: |-
        1. v1's schema: git show origin/v1:packages/db/src/schema.ts. rooms (id, number, a name of up to 15 characters, first_used_at, last_used_at); votes (room_id, average, highest and lowest estimation, amount of estimations and of spectators, duration, was_auto_flip, voted_at): one row per round; estimations (user_id, room_id, estimation, spectator, estimated_at): per person, with no link to a votes row; page_views and events (user_id, route or event, time); users (device, os, browser, country, region, city): never read.
        2. Rooms into room (origin v1, created_at from first_used_at, last_active_at from last_used_at, open, default settings) and room_slug: the number, and the name as a booked name and the primary address where v1 had one; release_at from last_used_at plus the hold of the constants file of v9-api-persistence (three months for a number, six for a name), imported from that file, never copied. A v1 name that breaks v9's rule (3 to 30 of a-z, 0-9 and the hyphen, at least one letter): read how v1 resolved names in URLs (origin/v1:apps/web/src/pages/room/[room].tsx and the room router) so each existing link keeps working, decide the mapping and record it; every room that cannot be carried is listed with its reason.
        3. Each votes row becomes one untitled topic and one round with what v1 recorded: revealed at voted_at, started duration seconds earlier, players and spectators, auto reveal; deck Fibonacci; no distribution and no round_vote rows. The summary (average, lowest, highest, count) is stored the way v9-api-read reads it.
        4. estimations are counted in the daily totals of stat_daily and attached to no round.
        5. Estimating days: the UTC days on which each v1 user_id cast a vote that was not a spectator's, as visitor_day rows hashed by the API's own function (HMAC-SHA256 with the server secret, 16 bytes), imported, never re-implemented, so a returning browser whose v1 userId became its device id lands on the same rows. visitor_day keeps 13 months: older days go into stat_daily only, as daily counts of estimators and new estimators; record.
        6. stat_daily: v1's page views by route and events by name per day, and every metric of v9-stats-rollups' file that v1's data can fill, under the same names, keyed by day, metric and dimension.
        7. The command: a dry run by default, printing counts per source and target table and every row it would skip with the reason; an apply flag writes in batched transactions; a second apply changes nothing (decide the key that makes it so, record); a report file with counts, skips and the time of each phase. It refuses a target that holds rooms of another origin unless told otherwise.
        8. Rehearsal: on the development host, a real production dump restored into a scratch MariaDB and imported into a scratch Postgres database made for it: never the shared development database, never production. Get the dump the way the repository already does, on the mini through secrets-run, never op; if it cannot be reached, ask the owner once through the factory. Record in the evidence file the run time, the counts per table and the skips, with no names or values; remove both scratch databases afterwards. The cutover's maintenance window is sized from this run time.
      acceptance: |-
        - A test on the fixture dump: the dry run prints counts and skips; apply, then apply again, leaves every table's count and checksum unchanged.
        - A test: a fixture room with a name gets two addresses with the release dates of the constants; a name that breaks the rule is listed as skipped with its reason.
        - A test: a v1 user id's vote day produces the same visitor value the API writes for that device id.
        - A test: no Postgres column after the import holds a fixture's device, city or raw user id.
        - The evidence file holds the rehearsal's run time, counts and skips, quoted in the pull request; GET /api/stats over the scratch database shows totals that match v1's own counts in a table.
        - make check passes.
      scope: |-
        No cutover run (stage 4). No Umami backfill (research r16). No archive of the dump or its Parquet export (stage 4). No per-person estimate attached to a round.

  - key: v9-site-stats
    title: 'The public statistics page at /analytics: figures in the HTML from a build-time snapshot, live islands with basalt-ui''s charts over GET /api/stats, the last known figures when the API is away'
    kind: feature
    prio: 1
    seat: {role: lead}
    after: [v9-site-look, v9-stats-rollups]
    after_needs: shipped
    facts:
      why: |-
        docs/v9/UX.md section Insights, paragraph Public statistics page: totals, rounds per week, card popularity, consensus rate, when the world estimates, tables open right now; v1 shows invented fallback numbers when its database is down, v9 shows the last known figures with their date. Section Being found: the live statistics are something worth citing, and the text must be in the HTML. Charts come from basalt-ui/charts (docs/v9/ARCHITECTURE.md section basalt-ui).
      what: |-
        apps/site/src/pages/analytics (replacing the scaffold's placeholder), apps/site/src/components/stats (the islands), the build step that fetches the snapshot, tests.
      change: |-
        1. At build time fetch GET /api/stats from the API of the build's target (the beta host until the cutover; the address is a build variable) and write the answer into the build. The page's text and headline figures are rendered from it, with the time it was computed. If the fetch fails, the build uses the snapshot the live page already serves, else a committed seed snapshot with its date, and never invents a figure: decide and record.
        2. Islands that load when visible: rounds per week as bars, card popularity per deck as bars, when the world estimates as a weekday-by-hour heatmap, the consensus rate and tables open right now as stat cards with sparklines, the week-over-week figures with one sentence on how working days are compared. Each fetches /api/stats when visible; when that fails it keeps the snapshot's figures and shows their date. No number appears that came from neither.
        3. Numbers and dates through Intl; strings from the site's content file or the catalogue.
        4. The path /analytics keeps its title and description; the page carries v9-site-schema's Article and BreadcrumbList data.
      acceptance: |-
        - With JavaScript off, a test over the output built from a fixture snapshot finds every headline figure and its date.
        - With the API stubbed to fail, the islands show the snapshot's figures and date, and no element shows a number that is in neither the API's answer nor the snapshot (a test).
        - A test counts requests: no chart script before its element is visible.
        - The page budget of v9-site-look holds outside the islands.
        - make check passes.
      scope: |-
        No new metric (v9-stats-rollups owns them). No yearly figures (v9-site-data). No Umami figures.

  - key: v9-site-data
    title: 'The yearly data page /data as a draft: what a year of anonymous rounds shows, every figure from a query in the repository, a dated methods paragraph, Dataset data'
    kind: feature
    prio: 1
    seat: {role: lead}
    after: [v9-site-stats, v9-importer]
    after_needs: shipped
    facts:
      why: |-
        docs/v9/UX.md section The marketing site, row /data: once a year, what a year of anonymous rounds shows (how often teams agree, which cards win, how long a round takes), figures from the product's own rounds; section Being found, row Something worth citing (original figures). docs/v9/research/r20-ai-search-visibility.md sections 4 and 6: original data draws links; Google no longer shows Dataset markup in Search, so it is a cheap baseline only. It waits for the importer so the figures span v1's years; it makes claims, so it is a draft the owner publishes.
      what: |-
        The query files and the script that runs them (one SQL file per figure, in a directory under apps/api such as apps/api/src/jobs/data-figures), the figures file the page reads, the page /data in apps/site, a Dataset component, the Makefile target data-figures, tests.
      change: |-
        1. The questions: how often teams agree (consensus rate, overall and by room size), which cards win (per deck), how long a round takes (start to reveal; v1's recorded duration for its years), when rounds happen. Add a figure only where the data carries it; each states its period and its count.
        2. One SQL file per figure, with a comment that says what it measures. make data-figures runs them all against a database given by URL and writes the figures file with the date, the period and a hash of each query. The first run uses the scratch database of v9-importer's rehearsal (recreate it the same way if it is gone); after the cutover it runs read-only against production.
        3. Anonymity: aggregates only; decide a minimum count per cell below which a figure is not shown, and record it.
        4. A dated methods paragraph: the sources (v1's years imported as summaries, v9's rounds with distributions), what v1 could not record (the cards of its rounds), what is left out and why.
        5. Dataset data (name, description, temporal coverage, creator, licence, the figures file as its distribution) and Article; draft: true. Each year a rerun prints the change against the previous figures.
      acceptance: |-
        - make data-figures against a fixture database reproduces the committed fixture figures exactly.
        - A test: every figure on the page names a query file that exists.
        - A test: no figure rests on a cell below the minimum count.
        - The production output holds no /data path; the beta output holds the page with valid Dataset data.
        - make check passes.
      scope: |-
        No new rollup (v9-stats-rollups). No figure from Umami. No figure about one room.

  - key: v9-edge-routing
    title: 'One hostname split by path on the beta host: the site as a Worker with static assets, routes without a Worker for /room*, /_room/* and /api/*, and three measured answers'
    kind: feature
    prio: 1
    seat: {tier: opus, effort: high}
    after: [v9-next-deploy, v9-site-scaffold]
    after_needs: shipped
    facts:
      why: |-
        docs/v9/ARCHITECTURE.md section Topology (a Worker route on /*, narrower routes with no Worker for /room*, /_room/* and /api/* that fall through to the tunnel and Traefik; proven on the beta host before anything depends on it; the fallback is the Worker proxying those paths with fetch, which also carries WebSocket upgrades), invariant 1 (one origin), and section Checks, CI and deploy (a push that touches the site deploys it with wrangler). docs/v9/research/r10-deploy-topology.md sections 2, 4 and 5; docs/v9/STRATEGY.md section What it costs (the Workers free tier; if asset requests are billed, the files move to the owner's own bucket behind his CDN); docs/v9/UX.md section Being found (Cloudflare blocks AI crawlers by default on new zones). An opus seat because the topology of production is decided here and a wrong answer surfaces at the cutover.
      what: |-
        apps/site's wrangler configuration and its _headers file, .github/workflows/deploy-site.yml, the Makefile (verify probes the site's paths on the beta host), docs/shipping.md, docs/v9/evidence/edge-routing.md.
      change: |-
        1. wrangler pinned exactly (version checked with agw web package npm wrangler); a Worker with the built site as its static assets and no Worker code; HTML handling that serves v1's paths as the scaffold chose; the site's 404 page for unknown paths. Version URLs are public when enabled (r10 section 2): turn them off or put them behind Access, and record.
        2. Routes on the zone: next.free-planning-poker.com/* to the Worker, and narrower routes with no Worker for /room*, /_room/* and /api/* on that hostname, which fall through to the tunnel and the fpp-api route v9-vps-next made. Check Cloudflare's rule for which route wins, on the day.
        3. _headers: X-Robots-Tag: noindex on every path of the beta build and none in the production build, plus the security headers the API's route sets.
        4. deploy-site.yml: on pushes to master that touch the lane site, and by dispatch, build the beta target and deploy; runs queue and never cancel. Then make indexnow if v9-site-crawl has shipped (it does nothing on beta).
        5. Credentials: Cloudflare changes go through the owner's Cloudflare tooling on the development host (the cloudflare skill); the credentials never enter the repository or a log. Name the repository secret the deploy job needs in the pull request and in docs/shipping.md; if you cannot set it, ask the owner once through the factory.
        6. Three measured answers in the evidence file, each with its commands and outputs (no token, no account id). (a) Does the split work without Worker code: the response headers of /, /guide, /room/<a fresh number>, a hashed file under /_room/ and /api/health show who served each, and make e2e-beta's smoke round passes over the WebSocket at /api/ws/<slug>. If not, build the fallback: Worker code that proxies those paths with fetch, WebSocket upgrades included, setting the security headers in code because _headers does not reach a response made by Worker code. (b) Are asset requests billed on the free plan: Cloudflare's pricing documentation read on the day, and the account's usage after a burst of asset requests. If they are billed, record it, say that the fallback is the owner's own object storage behind his CDN, and stop: that is his decision. (c) What the zone's settings do to AI crawlers (bot protection, AI crawler blocking, a managed robots.txt, the content signals Cloudflare adds to Markdown answers, research r20 section 2) against the bot policy of UX.md section Being found: fetch / with each crawler's user agent, align the beta zone through the tooling, and list what the production zone needs at the cutover.
        7. make verify probes / and /guide on the beta host for 200 and the noindex header.
      acceptance: |-
        - deploy-site.yml is green on a push; / and /guide on the beta host answer 200 from the Worker with the noindex header; /api/health answers from the API; /room/<number> answers with the room shell; make e2e-beta's smoke round passes.
        - docs/v9/evidence/edge-routing.md answers (a), (b) and (c) with commands and outputs.
        - A test over both builds: the beta _headers sets noindex on every path, the production one does not.
        - rg over the repository and the deploy run's log finds no credential.
        - make verify exits 0.
        - make check passes.
      scope: |-
        No change at the apex hostname or to v1's records (stage 4). No Umami route (v9-umami-proxy). No paid plan: that is the owner's decision.

  - key: v9-umami-proxy
    title: 'vps: Umami''s script and collect endpoint under /api/u on the Free Planning Poker beta hostname, with the visitor''s address handed through'
    kind: chore
    prio: 1
    seat: {role: lead}
    repo: vps
    after: [v9-edge-routing]
    after_needs: shipped
    facts:
      why: |-
        The rewrite of Free Planning Poker (free-planning-poker docs/v9/ARCHITECTURE.md section Topology, row /api/u/*, and section Measurement) serves Umami's tracker script and its collect endpoint on its own origin, so the browser contacts no second host. The hop in front of Umami must hand it the visitor's address, or every visitor with the same browser merges into one session (free-planning-poker docs/v9/research/r16-umami-tracker-import.md, section Server env vars and first-party serving). On next.free-planning-poker.com the paths /api/* already reach Traefik through the tunnel (free-planning-poker row v9-edge-routing).
      what: |-
        The Umami service's settings and a route for /api/u on the beta hostname, in the files this repository keeps for Umami and for fpp; the docs it keeps per service.
      change: |-
        1. On next.free-planning-poker.com, a Traefik router for the path prefix /api/u, with a higher priority than the fpp-api router on that hostname and with the security headers middleware, to the Umami service.
