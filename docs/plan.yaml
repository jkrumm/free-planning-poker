        2. Before the window: the DNS lifetimes of the apex and www and the edge cache lifetime of the site's HTML lowered at least one old lifetime ahead. Stage inert what can be staged: the Traefik router for the apex on fpp-api's paths, the tunnel ingress, the allowed WebSocket origin https://free-planning-poker.com. For each change in this repository (the Worker's routes, make verify's targets, Umami's data-domains) say whether it merges inert before the window or is a ready pull request merged at its step.
        3. Where production runs is decided (docs/v9/ARCHITECTURE.md section Cutover): the service fpp-api and the schema fpp that served the beta host become production; there is one instance. In the window, before the import, the beta's rooms and everything that hangs on them are removed from the schema, with the counts recorded, because v1's numbers and names would collide with them; the runbook has that step with its check (the tables are empty) and no rollback (the beta's rooms are test data). After the switch the beta hostname keeps answering from the same service with the noindex header.
        4. The window, in the order of ARCHITECTURE.md section Cutover. (a) Announce a short maintenance window on v1 and stop its writes: decide how, with the smallest possible change on the branch v1 or in the proxy, and record why. v1's web app writes to MariaDB from Vercel and v1's server holds the live rooms (read both with git show origin/v1); agents are denied pushes to v1 by .claude/settings.json, so a way that needs one is the owner's step. (b) A fresh production dump with its checksum. (c) The importer of v9-importer: dry run, counts against the rehearsal's, the run, its report, with the production API's secret so visitor_day holds the hash a returning browser produces. (d) The apex pointed at the Worker and the tunnel exactly as docs/v9/evidence/edge-routing.md proved it. (e) The noindex header removed from the site's pages on the apex; the beta host keeps it; /room stays out of every index as v9-site-parity proved. (f) Verify: make verify, the parity and smoke targets against the apex, an imported v1 room under its old address, a page view on the apex in Umami, one real round with two browser contexts.
        5. Rollback: the route change in reverse and v1's writes restored; Postgres stays for a second attempt. v1's server and its Vercel deployment keep running for 14 days, so rollback stays a route change for that period. State what a rollback loses: rooms and rounds created in v9 meanwhile, and v1's storage keys if v9's adoption removed them. No live room is carried over: none is running, because by the owner's ruling of 2026-11-19 the switch happens on a weekend.
        6. The rehearsal, once, on the beta host with a real production dump: dump, transfer, import, verify, then the import's rollback, each timed, in docs/v9/evidence/cutover-rehearsal.md. The dump never enters a repository, a log or the Issue, and is deleted afterwards. The route switch's proof is v9-edge-routing's.
        7. The Spec at docs/v9/evidence/cutover-go.md: the steps in one table with their measured durations; the maintenance window's length; what the owner must do himself and when (STRATEGY.md section Only you can: Vercel's settings, the donation link, Search Console and Bing after the switch, anything a lead cannot reach); the pages still marked draft: true that he may want to publish first; the link to /privacy on the beta host for him to read; and the sentence that his verdict is the start signal: he gives it at the beginning of the weekend window he chooses, and the factory files the cutover with its next planning pass, usually within minutes. At most three open choices. A verdict with notes is not the start signal: fold them in and ask again.
        8. After the go, ship the Issue at once, so that v9-cutover is filed.
      acceptance: |-
        - Every forward step of docs/v9/CUTOVER.md has a check with its expected output and a rollback step.
        - docs/v9/evidence/cutover-rehearsal.md holds the date, the commit, the dump's size, every step's duration, the importer's counts per table, and the import's rollback run once.
        - On the beta host after the rehearsal, an imported room opened under its v1 address and a two-seat round completed.
        - The Spec holds every part of step 7 with at most three open choices; the owner's verdict is recorded on the Issue.
        - rg over the row's files finds no credential, no dump content and no host name other than the allowed ones.
        - make check passes.
      scope: |-
        No production change: the window is v9-cutover's. No commit on the branch v1. The repository after the switch (project.yaml, URLs, documents, release 9.0.0) is v9-release-9's; v1's removal is v9-v1-remove's.

  - key: v9-cutover
    title: 'Cutover of Free Planning Poker in the vps repo: execute docs/v9/CUTOVER.md step by step in the window the owner chose, a check per step, rollback at the first failure'
    kind: chore
    prio: 1
    seat: {tier: opus, effort: high}
    repo: vps
    after: [v9-cutover-runbook]
    after_needs: shipped
    facts:
      why: |-
        The owner's verdict on v9-cutover-runbook is the start signal. This row switches production from v1 to v9 (free-planning-poker docs/v9/ARCHITECTURE.md section Cutover) exactly as that repository's docs/v9/CUTOVER.md says on its master. An opus seat because it changes production routing and imports production data.
      what: |-
        What free-planning-poker's docs/v9/CUTOVER.md names in this repository (the fpp-api service's routes and environment, the tunnel ingress, DNS through the cloudflare skill) and nothing else; the evidence file docs/v9/evidence/cutover.md of free-planning-poker.
      change: |-
        1. Read the runbook from a fresh checkout of free-planning-poker (git show origin/master:docs/v9/CUTOVER.md) and the Issue of v9-cutover-runbook for the owner's verdict and the window he named. Start only inside that window; before it, defer to its start with factory issue defer.
        2. Execute every step as written, in order. Before each step note its start time; after it, the check's output as the runbook states it, and met or not met.
        3. At the first check that fails, stop. Execute the rollback step of every step already done, in reverse, as written; prove that v1 serves production again with v1's own make verify (its probes: git show origin/v1:Makefile); record what failed with its output. Then close the Issue as dropped with that reason: v9-release-9 waits for this row shipped, so the factory files a Replan and the next attempt is planned there.
        4. Change no step on your own judgement. A step that cannot be executed as written (a command that does not exist, a check that cannot be read) ends the attempt with the rollback of step 3; its fix is a correction of the runbook in free-planning-poker.
        5. After the last step: free-planning-poker's make verify exits 0 against production, and one real two-seat round is played on https://free-planning-poker.com/room/ with a fresh slug in two browser contexts (the verifier or the browse skill).
        6. Ship this repository's changes as its rules say (by push, then make deploy and make verify for the apps they touch). Write free-planning-poker's docs/v9/evidence/cutover.md: per step the time, the duration beside the rehearsal's, the output and the result; the importer's report; the window's real length. Add it there through a pull request if that repository's rules allow it from this session, else attach it to the Issue and say so.
        7. v1's server, MariaDB and Vercel deployment keep running: they are the rollback for 14 days.
      acceptance: |-
        - Every step of the runbook has a line in docs/v9/evidence/cutover.md with its check's output and the result met.
        - free-planning-poker's make verify exits 0 against production; the output is quoted.
        - A two-seat round on production completed; the evidence is linked.
        - curl -sI https://free-planning-poker.com/ shows no X-Robots-Tag noindex; curl -sI https://next.free-planning-poker.com/ still shows it.
        - An imported v1 room opens under its old address on production.
        - Or, after a failure: the rollback is recorded step by step, v1's make verify exits 0, and the Issue is closed dropped naming the failing step.
        - make check passes.
      scope: |-
        Nothing beyond the runbook, no fix in free-planning-poker's code. v1's services, MariaDB and their routes stay (v9-v1-remove); the archive is v9-v1-archive's; production targets and release 9.0.0 in free-planning-poker are v9-release-9's.

  - key: v9-release-9
    title: 'This repository after the switch: production as the deploy target, the canonical host, noindex only on the beta host, the documents without beta, and release 9.0.0 through release.yml'
    kind: chore
    prio: 1
    seat: {role: lead}
    after: [v9-cutover]
    after_needs: shipped
    facts:
      why: |-
        After v9-cutover production runs v9, but this repository still treats the beta host as v9's only place and the release is still 8.5.0 (package.json, CHANGELOG.md). Contract: docs/v9/ARCHITECTURE.md sections Checks, CI and deploy, Topology and Cutover; docs/v9/UX.md section Being found (canonical links, sitemap, IndexNow); docs/shipping.md section Releases; AGENTS.md section Shipping.
      what: |-
        project.yaml, the Makefile (verify and every target that names a host), the site's canonical host and every absolute URL (apps/site configuration, structured data, llms.txt as generated, README.md's live link), the switch between beta and production that v9-site-crawl and v9-edge-routing built for the noindex header and make indexnow, deploy workflows only where they name a host, AGENTS.md, README.md, docs/shipping.md, docs/development.md, and docs/v9/ARCHITECTURE.md and docs/v9/ENGINEERING.md where they say until the cutover.
      change: |-
        1. project.yaml: the target prod verifies v9 in production with make verify. There is one instance (docs/v9/ARCHITECTURE.md section Cutover): a push to master now deploys to production, as v1's did, and the beta hostname is a second name of the same service that keeps its noindex header. The beta target of project.yaml is retired; say so in the file's comment and in docs/shipping.md. factory project check passes.
        2. make verify probes production (the site at https://free-planning-poker.com/, /api/health and /api/version on the apex) and that the beta hostname still answers with its noindex header. v1 keeps running until v9-v1-hosting-end: decide whether its probes stay until then, and record.
        3. The canonical host is https://free-planning-poker.com in every canonical link, the sitemap, robots.txt's sitemap line, structured data, Open Graph URLs, llms.txt and the README. Afterwards rg for next.free-planning-poker.com finds it only where the beta host is meant.
        4. No noindex header on any site page in production; the beta host keeps it on every response; /room stays out of every index as v9-site-parity proved.
        5. make indexnow runs on production deploys, and once for the whole sitemap after this row's deploy; the response codes go into the pull request. The sitemap answers on the apex and lists no draft and no room path.
        6. If the owner has removed the draft flag of the first blog post (v9-site-blog), it is in the production build and the sitemap; otherwise nothing changes for it.
        7. AGENTS.md, README.md and docs no longer say beta or describe v9 as unreleased; v1 is described as retired from production and kept on the branch v1.
        8. After merge and deploy, release 9.0.0 through release.yml, never by hand and never by editing CHANGELOG.md (docs/shipping.md section Releases). First gh workflow run release.yml -f dry_run=true -f allow_major=true and read the version it resolves: it is 9.0.0 only if a commit since 8.5.0 carries a breaking change. If it resolves anything else, this row's own commit carries the breaking change (a ! after the type, or a BREAKING CHANGE footer naming the switch to v9; check that commitlint.config.ts accepts it) and the dry run is repeated after the merge. Then gh workflow run release.yml -f allow_major=true.
      acceptance: |-
        - gh release view 9.0.0 shows the release, and CHANGELOG.md starts with 9.0.0 as release-it wrote it.
        - make verify exits 0 and names production in its output; factory project check passes.
        - curl -sI https://free-planning-poker.com/ shows no noindex header; curl -sI https://next.free-planning-poker.com/ shows it.
        - The sitemap named in robots.txt answers 200 on the apex and lists no draft and no /room path.
        - The IndexNow responses are quoted in the pull request.
        - rg -n 'next\.free-planning-poker\.com' outside docs/v9 lists only lines that mean the beta host.
        - make check passes.
      scope: |-
        No feature change. The branch v1, its workflows and the Vercel project are v9-v1-hosting-end's; v1's containers and MariaDB are v9-v1-remove's. Search Console and Bing Webmaster Tools are the owner's.

  - key: v9-v1-hosting-end
    title: 'End of v1''s hosting on this repository''s side: v1''s deploy workflow disabled, the branch v1 kept and tagged v1-final, the documents corrected'
    kind: chore
    prio: 1
    seat: {role: light}
    after: [v9-release-9]
    after_needs: shipped
    after_days: 14
    facts:
      why: |-
        v1 kept running for 14 days after the release so that rollback stayed a route change (docs/v9/ARCHITECTURE.md section Cutover; docs/v9/ENGINEERING.md section Where v1 lives). This row ends what this repository does for v1's hosting. Small and mechanical.
      what: |-
        The state of v1's deploy workflow in GitHub Actions, the tag v1-final, .claude/settings.json (the deny rule for the branch v1), the Makefile (v1's probes, if still there), AGENTS.md, README.md, docs/shipping.md, docs/v9/ENGINEERING.md section Where v1 lives, docs/v9/ARCHITECTURE.md section Checks, CI and deploy.
      change: |-
        1. First confirm that production is still v9 (curl -fsS https://free-planning-poker.com/api/version answers a commit of master) and that the Issue of v9-cutover has no note of a rollback. If a rollback happened, close this Issue as dropped with that reason.
        2. Disable the workflow on the branch v1 that deploys (deploy.yml, which rolls out v1's server and analytics service) with gh workflow disable. It needs no push, and a push to v1 is denied by .claude/settings.json. Check first with gh workflow list --all that the workflow is listed and that no workflow on master has the same path. If it cannot be disabled that way, raise one errand for the owner with factory errand raise to remove the triggers on v1, and go on with the rest.
        3. Tag v1-final at the head of v1 (git tag v1-final origin/v1, push the tag only); v1-freeze stays. docs/v9/ENGINEERING.md section Where v1 lives names no final tag: write the name there. The branch v1 stays, protected against force pushes and deletion.
        4. .claude/settings.json: the deny on pushes to v1 stays; add denies on deleting or moving the tags v1-freeze and v1-final. No ask rule.
        5. make verify no longer probes v1's server and analytics hostnames, if v9-release-9 left them in.
        6. The documents: v1 no longer runs; how it is read (git show origin/v1:<path>) stays; docs/shipping.md loses how v1 is fixed and redeployed; the row Production of the table in ENGINEERING.md section Where v1 lives says retired, with the date.
        7. The Vercel project is the owner's to remove (docs/v9/STRATEGY.md section Only you can): say so in the pull request and ask him once with factory errand raise; do not wait for the answer.
      acceptance: |-
        - gh workflow list --all shows v1's deploy workflow as disabled, or the pull request names the errand for it.
        - git ls-remote --tags origin shows v1-final at the commit of origin/v1.
        - gh api of the branch protection of v1 shows force pushes and deletion refused.
        - make verify exits 0 and probes no v1 hostname.
        - rg over AGENTS.md, README.md and docs/shipping.md finds no sentence that says v1 runs or deploys.
        - make check passes.
      scope: |-
        No commit on the branch v1. v1's containers and MariaDB are v9-v1-remove's; the Vercel project is the owner's.

  - key: v9-v1-archive
    title: 'Archive of Free Planning Poker v1 in the vps repo: the final MariaDB dump and the analytics Parquet export in the backup storage, checksummed, with a restore proven in a scratch container'
    kind: chore
    prio: 1
    seat: {role: lead}
    repo: vps
    after: [v9-cutover]
    after_needs: shipped
    after_days: 14
    facts:
      why: |-
        v1's MariaDB is deleted only after its final dump is archived and its restore proven (free-planning-poker docs/v9/ARCHITECTURE.md sections Data model and Cutover; docs/v9/STRATEGY.md section Numbers and history: the final dump is archived together with its Parquet export). It runs 14 days after the cutover. Nothing is removed in this row.
      what: |-
        A one-off archive procedure placed as this repository's conventions place one, the backup storage this repository already uses, the documents that say where the archive is and how long it is kept, and the evidence in free-planning-poker's docs/v9/evidence/v1-archive.md or on the Issue.
      change: |-
        1. First confirm that production is still v9 (the apex answers /api/version) and that the Issue of v9-cutover records no rollback; else close this Issue as dropped with that reason.
        2. Dump v1's MariaDB as one consistent snapshot of every table of its schema (one transaction, schema and routines included), compressed, with its SHA-256. Take the Parquet files the analytics service keeps on its data volume as they are. Neither is written into a repository or a log.
        3. Write both to the backup storage this repository already uses, apart from the rolling backups so that no lifecycle rule of theirs can delete them; read the stored objects' checksums back and compare.
        4. Restore proof: through a make target (this repository runs every container through its Makefile), start a scratch MariaDB container with the image v1's MariaDB service pins, on no network production uses; load the dump downloaded back from the storage; compare SELECT COUNT(*) per table with the source database. Then remove the scratch container and its volume. This repository's own restore procedure for production is not used: it overwrites production.
        5. Compare the counts with those free-planning-poker's docs/v9/evidence/cutover.md recorded. A table that grew after the cutover means v1 took writes after the switch: list each such table with its difference, because those rows are not in v9.
        6. This repository's documents state where the archive is, its checksums and how long it is kept. No document names the period: decide it and record why, and make sure no lifecycle rule deletes it earlier.
      acceptance: |-
        - Both archive objects exist in the backup storage and their checksums match the recorded ones.
        - The comparison shows every table of the source with an equal count in the scratch container; the table is in the evidence.
        - No scratch container or volume remains, shown by the repository's listing target.
        - The documents name the archive's place, its checksums and its retention.
        - make check passes.
      scope: |-
        Nothing is stopped or removed: v1's services and MariaDB are v9-v1-remove's. No change to the rolling backups or to the production restore procedure.

  - key: v9-v1-remove
    title: 'Removal of Free Planning Poker v1 in the vps repo after the owner''s verdict: its server, analytics service, updater, MariaDB and every route, monitor and dashboard of theirs (gate)'
    kind: chore
    prio: 1
    seat: {role: lead}
    checkpoint: gate
    repo: vps
    after: [v9-v1-archive, v9-v1-hosting-end]
    after_needs: shipped
    facts:
      why: |-
        The last of the five gates and the plan's last row: removing MariaDB deletes data, so only the owner's verdict starts it (free-planning-poker docs/v9/ARCHITECTURE.md section Cutover; docs/v9/STRATEGY.md sections Only you can and What it costs: MariaDB, v1's server, the analytics service and its updater go). It runs after the archive is proven (v9-v1-archive) and after v1's hosting ended on the code side (v9-v1-hosting-end).
      what: |-
        Everything in this repository that exists only for v1, listed by the lead from the repository itself: the services fpp-server, fpp-analytics and fpp-analytics-updater and the MariaDB service with their volumes (fpp-api stays in the same compose file); the scripts, make targets, backup job and restore script only they used; v1's hostnames in the proxy, the tunnel ingress and DNS; their telemetry registry entries, monitors, dashboards and alerts (the ones v9-vps-observability marked); their lines in the secrets template; the documents that list them.
      change: |-
        1. The Spec for the owner: what will be deleted, one line each with where it lives (the list above, with the volumes by name and anything that exposes MariaDB to the outside); what stays (fpp-api, the schema fpp, Umami, and every shared service's other users); the proof of v9-v1-archive (the archive's place, its checksums, the restore counts); and that the 14 days passed without a rollback (the cutover's date, today's date, the Issue of v9-cutover without a rollback note). At most three open choices.
        2. After his verdict, through this repository's targets: stop and remove the four services, then their volumes; then v1's routes, tunnel ingress and DNS records; then the registry entries, monitors, dashboards and alerts; then MariaDB's backup job, its restore script, whatever guarded or exposed its port, and the secrets template lines. Remove what v1's server left in a shared service if the repository's notes say something is there. Decide whether v1's images leave the registry and record it.
        3. Prove the result: free-planning-poker's make verify exits 0 against production; each removed hostname resolves to no record and answers nothing; no container, volume or route of v1 remains; the archive still exists with its checksums.
      acceptance: |-
        - The owner's verdict is recorded on the Issue.
        - free-planning-poker's make verify exits 0 against production after the removal; the output is quoted.
        - dig returns no record for each removed hostname, and curl to each fails.
        - The repository's container and volume listing shows none of the removed services or volumes; make telemetry-lint passes without the two removed registry entries.
        - The archive's objects are read back after the removal and their checksums match.
        - make check passes.
      scope: |-
        fpp-api, the schema fpp, Umami and every shared service stay. Nothing in free-planning-poker. The development host's entries for v1 (its local hostnames and database) are removed by an Issue this row's lead files in that repository with factory issue new; it does not wait for it.
