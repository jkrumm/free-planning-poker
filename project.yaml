# How the factory ships this project (software-factory docs/project.md).
apiVersion: factory/v2
name: free-planning-poker
deploy:
  mode: auto # a push to master deploys: Vercel (web) + deploy.yml → RollHook (fpp-server, fpp-analytics); `make deploy` is a no-op
  targets:
    - { name: prod, host: vps, verify: make verify } # probes web, server and analytics health
  hold: 10m # Vercel build + RollHook rollout finish before the verify counts
ship:
  - { via: pr } # master branch protection requires a PR, see AGENTS.md §Shipping & Release
# One merge window at a time: every master push redeploys prod through the shared deploy.yml queue,
# and a rebase onto a moving master invalidates the CI run of another lead's PR.
leads: 1
