# yaml-language-server: $schema=https://raw.githubusercontent.com/jkrumm/software-factory/master/schema/project.schema.json
# How the factory ships this project (software-factory docs/project.md). Where migrations live and run: AGENTS.md and .claude/rules/migrations.md.
apiVersion: factory/v2
name: free-planning-poker
deploy:
  mode: auto # CI owns the deploys (.github/workflows/deploy-next.yml rolls the beta host); v1 deploys from the branch v1 (Vercel + its deploy.yml); `make deploy` is a no-op
  targets:
    - { name: prod, host: vps, verify: make verify } # v1 (web, server, analytics) and the beta host
    - { name: next, host: vps, verify: make verify-next } # the beta host, next.free-planning-poker.com: /api/health
  hold: 10m # a master push changes nothing in production today; the beta host is rolled by CI
ship:
  - { via: pr } # master branch protection requires a PR and the check `ci`, see AGENTS.md §Deploy
# A lead runs check-fast before each push; CI's `check` job runs `make check` on the pull request head (hosted runners: the repo is public).
checks: { fast: make check-fast, full: make check, ci: true }
budgets:
  fast: 60s # docs/v9/ENGINEERING.md Targets: check-fast warm on the mini in 60 s at most, so leads run it before every push
steps:
  # The marketing site: builds production, beta and the fixture content with Astro on Bun, then tests the output (lane site in .github/lanes).
  # Not remote yet: the step image is unproven for Astro 7; add remote: true once a run there is green.
  site: { make: site }
  # The server tier: each test starts a private PostgreSQL cluster from PG_BIN_DIR (the step image has PostgreSQL 16; CI proves 18).
  # remote: true because it needs nothing the step image lacks: bun of packageManager and the PostgreSQL 16 binaries.
  test-server: { make: test-server, remote: true }
lanes:
  browser: 2 # v9 rows that run Playwright (docs/plan.yaml: end-to-end suite, table arena); two Chromium suites beside other leads is what the mini's memory carries
  ui: 4 # v9 rows of the room's interface (component tests and screenshots in one Chromium each); a first guess, replaced by v9-plan-table with what v9-ui-foundation's run measured
