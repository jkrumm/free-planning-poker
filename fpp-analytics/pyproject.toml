[project]
name = "fpp-analytics"
version = "2.0.0"
description = "Free Planning Poker Analytics - FastAPI + Polars"
requires-python = ">=3.14"
dependencies = [
    # Web framework (starlette 1.0 transitively via fastapi 0.136+)
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.46.0",
    # Data processing
    "polars>=1.40.0",
    # Database (direct connection, same docker network)
    "pymysql>=1.1.3",
    # HTTP client (email service, UptimeKuma)
    "httpx>=0.28.0",
    # Observability — OpenTelemetry → ClickStack/HyperDX
    "opentelemetry-api>=1.42.0",
    "opentelemetry-sdk>=1.42.0",
    # HTTP/protobuf exporter — matches the rest of the FPP stack (Argo, fpp-server,
    # browser SDK) which all target the unauthed ClickStack :4319 receiver. The
    # gRPC ports (:4317) are authed in prod; switching to HTTP avoids needing an
    # auth header in the OTLP exporter config.
    "opentelemetry-exporter-otlp-proto-http>=1.42.0",
    "opentelemetry-instrumentation-fastapi>=0.63b0",
    "opentelemetry-instrumentation-logging>=0.63b0",
    # Environment
    "python-dotenv>=1.2.2",
    "python-json-logger>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calculations", "routers", "util"]
include = ["main.py", "config.py", "update_readmodel.py"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Function call in defaults (FastAPI Depends)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["calculations", "routers", "util"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["polars.*", "httpx.*", "pymysql.*"]
ignore_missing_imports = true
