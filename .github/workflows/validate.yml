name: Validate

on: [pull_request]

# Caching strategy:
# - npm: setup-node's built-in `cache: 'npm'` caches ~/.npm (the tarball store)
#   keyed by package-lock.json. `npm ci` then resolves locally without network.
#   Never cache node_modules — it's tied to OS/Node ABI and defeats `npm ci`.
# - bun: setup-bun has no built-in package cache, so we manually cache
#   ~/.bun/install/cache keyed by bun.lock. `bun install --frozen-lockfile`
#   resolves from the cache.
# - uv: setup-uv's built-in `enable-cache` caches the uv tarball store.

jobs:
  # Next.js Validation (4 jobs)
  validate-nextjs-typecheck:
    name: Next.js - Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('fpp-server/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: cd fpp-server && bun install --frozen-lockfile
      - run: npm run type-check
        env:
          SKIP_ENV_VALIDATION: '1'

  validate-nextjs-formatting:
    name: Next.js - Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check

  validate-nextjs-linting:
    name: Next.js - Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
        env:
          SKIP_ENV_VALIDATION: '1'

  validate-nextjs-build:
    name: Next.js - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SKIP_ENV_VALIDATION: '1'

  # fpp-server Validation (4 jobs)
  validate-fpp-server-formatting:
    name: fpp-server - Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('fpp-server/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cd fpp-server && bun install --frozen-lockfile
      - run: cd fpp-server && bun run format:check

  validate-fpp-server-linting:
    name: fpp-server - Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('fpp-server/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cd fpp-server && bun install --frozen-lockfile
      - run: cd fpp-server && bun run lint

  validate-fpp-server-typecheck:
    name: fpp-server - Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('fpp-server/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cd fpp-server && bun install --frozen-lockfile
      - run: cd fpp-server && bun run type-check

  validate-fpp-server-build:
    name: fpp-server - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('fpp-server/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cd fpp-server && bun install --frozen-lockfile
      - run: cd fpp-server && bun run build

  # fpp-analytics Validation (3 jobs)
  validate-fpp-analytics-formatting:
    name: fpp-analytics - Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: 'fpp-analytics/uv.lock'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: cd fpp-analytics && uv sync --extra dev
      - run: cd fpp-analytics && uv run ruff format --check .

  validate-fpp-analytics-linting:
    name: fpp-analytics - Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: 'fpp-analytics/uv.lock'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: cd fpp-analytics && uv sync --extra dev
      - run: cd fpp-analytics && uv run ruff check .

  validate-fpp-analytics-typecheck:
    name: fpp-analytics - Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: 'fpp-analytics/uv.lock'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: cd fpp-analytics && uv sync --extra dev
      - run: cd fpp-analytics && uv run mypy .
