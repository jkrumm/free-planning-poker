name: Self-hosting

# Follows https://free-planning-poker.com/self-hosting on a clean runner: the commands are read from the page's source
# (apps/site/scripts/page-commands.ts) and run as written, then the end-to-end suite's smoke tests drive the stack. A signal, not
# part of the gate job `ci`: nothing requires it, and a scheduled run is best effort on GitHub.
#
# On a pull request the page fetches nothing from the network: the address of the raw files is swapped for this checkout
# (what the pull request changes is not on master yet) and the image is built from this checkout under the published name. On a
# schedule, a dispatch or a push the commands run untouched against master's files and the published image, pulled with no login.
on:
  pull_request:
    paths:
      - deploy/**
      - apps/site/src/pages/self-hosting.astro
      - apps/site/scripts/page-commands.ts
      - .github/workflows/selfhost.yml
  schedule:
    # Not on the hour, when every scheduled workflow on GitHub starts at once.
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/jkrumm/free-planning-poker:latest
  RAW: https://raw.githubusercontent.com/jkrumm/free-planning-poker/master/

jobs:
  selfhost:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      # The page's source is the only place the commands are written.
      - name: Read the commands from the page
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blocks"
          for block in start update backup restore; do
            bun apps/site/scripts/page-commands.ts "$block" > "$RUNNER_TEMP/blocks/$block.sh"
            echo "::group::$block"
            cat "$RUNNER_TEMP/blocks/$block.sh"
            echo "::endgroup::"
          done
          if [ "$EVENT" = pull_request ]; then
            # The checkout stands in for master on the raw-file address; the swap must have changed the start block.
            sed -i "s|$RAW|file://$GITHUB_WORKSPACE/|g" "$RUNNER_TEMP/blocks/start.sh"
            grep -q "file://$GITHUB_WORKSPACE/deploy/compose.yml" "$RUNNER_TEMP/blocks/start.sh"
          fi
        env:
          EVENT: ${{ github.event_name }}

      # Any other run pulls the published tag with no credentials: the runner is not logged in to ghcr.io.
      - name: Pull the published image anonymously
        if: github.event_name != 'pull_request'
        run: |
          docker logout ghcr.io || true
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format 'pulled {{.Id}}'

      # A pull request changes the image's compose file and maybe its code, and master has not published them yet: build the
      # image from this checkout under the published name, so the compose file runs unchanged.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: github.event_name == 'pull_request'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: github.event_name == 'pull_request'
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=fpp-api
      - name: Report whether the image is already published
        if: github.event_name == 'pull_request'
        run: |
          out=$(docker manifest inspect "$IMAGE" 2>&1) && echo "::notice::$IMAGE is published and pullable" || echo "::notice::$IMAGE is not published yet: $out"

      # docker compose up with only the example settings stops and names the missing secret, each in turn.
      - name: A start without the secrets stops and names them
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          cp deploy/compose.yml "$dir/compose.yml"
          cp deploy/.env.example "$dir/.env"
          cd "$dir"
          if out=$(docker compose up -d 2>&1); then echo "$out"; echo "::error::compose started without secrets"; exit 1; fi
          echo "$out"
          grep -q 'POSTGRES_PASSWORD is not set' <<<"$out"
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=abc|' .env
          if out=$(docker compose up -d 2>&1); then echo "$out"; echo "::error::compose started without VISITOR_KEY"; exit 1; fi
          echo "$out"
          grep -q 'VISITOR_KEY is not set' <<<"$out"

      - name: Start, as the page says
        working-directory: ${{ runner.temp }}
        run: |
          mkdir site
          cd site
          bash -euo pipefail "$RUNNER_TEMP/blocks/start.sh"
      - name: The API answers 200
        working-directory: ${{ runner.temp }}/site/free-planning-poker
        run: |
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused http://localhost:7740/api/health
          echo
          curl -fsS http://localhost:7740/room/x | grep -q '/_room/'
          rm -f .env.bak
          grep -c '^POSTGRES_PASSWORD=.\{48\}$' .env
          grep -c '^VISITOR_KEY=.\{64\}$' .env

      - run: e2e/node_modules/.bin/playwright install --with-deps --only-shell chromium
      - name: The end-to-end smoke tests, two seats and more, against the stack
        run: e2e/node_modules/.bin/playwright test -c e2e/suite/playwright.config.ts --grep @smoke
        env:
          E2E_BASE_URL: http://localhost:7740

      - name: Back up and restore, as the page says
        working-directory: ${{ runner.temp }}/site/free-planning-poker
        run: |
          bash -euo pipefail "$RUNNER_TEMP/blocks/backup.sh"
          gzip -t fpp-backup.sql.gz
          test "$(gunzip -c fpp-backup.sql.gz | grep -c 'CREATE TABLE')" -gt 0
          bash -euo pipefail "$RUNNER_TEMP/blocks/restore.sh"
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused http://localhost:7740/api/health
      - name: Update, as the page says
        # On a pull request the published tag may not exist yet, and pulling it would replace the image built above.
        if: github.event_name != 'pull_request'
        working-directory: ${{ runner.temp }}/site/free-planning-poker
        run: |
          bash -euo pipefail "$RUNNER_TEMP/blocks/update.sh"
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused http://localhost:7740/api/health

      - name: Compose logs
        if: failure()
        working-directory: ${{ runner.temp }}/site/free-planning-poker
        run: docker compose logs --no-color
      - name: Remove the stack
        if: always()
        working-directory: ${{ runner.temp }}/site/free-planning-poker
        run: docker compose down --volumes --remove-orphans
