name: Nightly

# What is too slow for every pull request (docs/v9/ENGINEERING.md, CI): from v9-room-runtime on, 10,000 simulator
# seeds. A scheduled run is best effort on GitHub and nothing waits for it; a red nightly is a signal to the factory,
# not a merge blocker. Later rows add the reduced load profile, the other browsers and the arm64 build as jobs here.
on:
  schedule:
    # Not on the hour, when every scheduled workflow on GitHub starts at once.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: Simulator seeds to run
        default: '10000'
      from:
        description: First seed
        default: '1'

permissions:
  contents: read

jobs:
  # bun run sim stops at the first failing seed and prints the command that replays it.
  simulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run sim --seeds "$SEEDS" --from "$FROM"
        env:
          SEEDS: ${{ inputs.seeds || '10000' }}
          FROM: ${{ inputs.from || '1' }}
