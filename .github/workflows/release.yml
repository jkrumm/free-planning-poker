name: Release

# Bumps version, generates CHANGELOG, creates a tag + GitHub release. The chore
# commit it pushes to master triggers deploy.yml automatically (the redeploy is
# idempotent — same source, same image digest, no rollout). Vercel picks up the
# same commit through its GitHub integration and deploys NextJS.
#
# Run via `gh workflow run release.yml` (or `/release-fpp` for AI-enhanced notes).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (analyze version without publishing)
        type: boolean
        default: false
      allow_major:
        description: Permit a major version bump (required when a commit carries a breaking change)
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: release-it
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # PAT required to push the chore commit when master is branch-protected.
          # Falls back to GITHUB_TOKEN if RELEASE_TOKEN secret isn't set.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Configure git author
        run: |
          git config user.name "Johannes Krumm"
          git config user.email "jkrumm@users.noreply.github.com"

      # Pre-flight gate. Two failure modes release-it does not surface on its own:
      #
      #  1. No bump-eligible commits. conventional-changelog v10 only bumps for
      #     types marked `effect: "bump"` in .release-it.json, so a window of only
      #     chore/test/style/build resolves to no version — release-it prints
      #     "No new version to release" and exits 0. Without this gate the run is
      #     green and silently releases nothing.
      #  2. An accidental major. A stray `feat!:` or a `BREAKING CHANGE:` footer
      #     takes the bump straight to the next major with no confirmation step.
      #     Require the allow_major input to be set deliberately.
      - name: Resolve and gate next version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! OUT=$(bunx release-it --release-version 2>/dev/null); then
            echo "::error::release-it could not resolve the next version"
            exit 1
          fi

          # --release-version prints the version on stdout; hook output can precede it.
          NEXT=$(printf '%s\n' "$OUT" | tail -n1 | tr -d '[:space:]')

          if ! printf '%s' "$NEXT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::No bump-eligible commits since the last tag — nothing to release."
            echo "::error::Only types marked 'effect: \"bump\"' in .release-it.json count; chore/test/style/build do not."
            exit 1
          fi

          CURRENT=$(node -p "require('./package.json').version")
          if [ "${NEXT%%.*}" -gt "${CURRENT%%.*}" ] && [ "${{ inputs.allow_major }}" != "true" ]; then
            echo "::error::Refusing a major bump ($CURRENT -> $NEXT) without allow_major."
            echo "::error::A commit carries a breaking change. Re-run with allow_major=true if that is intended."
            exit 1
          fi

          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Releasing $CURRENT -> $NEXT"

      - name: Run release-it
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            bunx release-it --ci --dry-run
          else
            bunx release-it --ci
          fi
