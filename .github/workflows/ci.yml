name: CI

# What every pull request and every master push must pass, and the one check that says so (docs/v9/ENGINEERING.md, CI).
# Branch protection of master requires `ci` and nothing else, so adding or renaming a job never blocks merges.
#
# Lanes by a file and a script, not by `paths:` here: a workflow a path filter skips leaves its required check pending
# forever, while a job skipped by a condition counts as passed. `lanes` reads .github/lanes and the diff; a lane job
# (image, e2e, site, arena: added by their rows) runs with `if: needs.lanes.outputs.<lane> == 'true'` and goes into the
# `needs` of `ci`, whose script (.github/gate.sh) reads every needed job without a change.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A newer push to a pull request cancels its older run; pushes to master always finish (they will deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit, the tag in the comment. Bun is the version of package.json's packageManager.
jobs:
  lanes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.lanes.outputs.app }}
      site: ${{ steps.lanes.outputs.site }}
      arena: ${{ steps.lanes.outputs.arena }}
    steps:
      # Depth 2: a pull request is checked out as its merge commit, whose first parent is the base it merges into.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: lanes
        run: .github/lanes.sh
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}

  # make check: check-fast, the server tests against a private PostgreSQL 18 cluster per test, the build.
  # No dependency cache: a restored cache did not make bun install --frozen-lockfile faster (docs/development.md, CI).
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: .github/postgres.sh 18
      - run: bun install --frozen-lockfile
      - run: make check
        env:
          PG_BIN_DIR: /usr/lib/postgresql/18/bin

  # make site: builds apps/site for production and beta, then tests the output (scripts, links, page budgets, the draft rule).
  # Astro runs on Bun (bunx --bun), so no Node setup. Runs only when lane site changed; the gate counts a skip as passed.
  site:
    needs: lanes
    if: needs.lanes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: make site

  # The table arena: scores the reference entry and every entry the change touches (.github/arena.sh), in Playwright's
  # bundled headless shell; the scorecards are an artifact. Playwright runs on the runner's Node (20, which it needs at least).
  arena:
    needs: lanes
    if: needs.lanes.outputs.arena == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' e2e/package.json)" >> "$GITHUB_OUTPUT"
      - id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-headless-shell-ffmpeg
      - if: steps.browser.outputs.cache-hit != 'true'
        run: e2e/node_modules/.bin/playwright install --only-shell chromium ffmpeg
      - run: .github/arena.sh
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: arena-scores
          path: arena/scores
          retention-days: 14
          if-no-files-found: ignore

  # The image (apps/api/Dockerfile): the API with the room app it serves, built with BuildKit's GitHub cache backend, one scope
  # per image, and started from deploy/compose.yml as a smoke test. The image goes on as an artifact for the end-to-end suite.
  # No registry push: the beta host is rolled by deploy-next.yml, which builds its own image. Runs only when lane app changed.
  image:
    needs: lanes
    if: needs.lanes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          build-args: OTEL_SERVICE_VERSION=${{ github.sha }}
          tags: fpp-api:local
          cache-from: type=gha,scope=fpp-api
          cache-to: type=gha,scope=fpp-api,mode=max
          outputs: type=docker,dest=${{ runner.temp }}/fpp-api.tar
      - run: docker load --input "${{ runner.temp }}/fpp-api.tar"
      - run: make v9-image-perms
      - run: make v9-size | tee -a "$GITHUB_STEP_SUMMARY"
      - run: make v9-up V9_UP_FLAGS=--no-build
      - run: make v9-smoke
      - if: failure()
        run: make v9-logs
      - if: always()
        run: make v9-down
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fpp-api-image
          path: ${{ runner.temp }}/fpp-api.tar
          retention-days: 1
          compression-level: 0

  # The end-to-end suite (e2e/suite): one browser context per seat against the image of the `image` job, started from
  # deploy/compose.yml by e2e/suite/run.ts. Playwright runs on the runner itself, not in a container, because one test
  # replaces the API container mid-round and needs Docker. Two shards; each starts its own stack. Chromium only, in the
  # bundled headless shell. One retry exists to record a trace and the config fails a test that needed it. Runs only when
  # lane app changed.
  e2e:
    needs: [lanes, image]
    if: needs.lanes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fpp-api-image
          path: ${{ runner.temp }}
      - run: docker load --input "${{ runner.temp }}/fpp-api.tar"
      # The bundled headless shell is cached per Playwright version; the install runs on a miss only.
      - id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' e2e/package.json)" >> "$GITHUB_OUTPUT"
      - id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-headless-shell
      - if: steps.browser.outputs.cache-hit != 'true'
        run: e2e/node_modules/.bin/playwright install --only-shell chromium
      - run: bun e2e/suite/run.ts --shard=${{ matrix.shard }}/2
        env:
          E2E_NO_BUILD: '1'
          E2E_IMAGE: fpp-api:local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: e2e/suite/blob-report
          retention-days: 1
          if-no-files-found: ignore

  # The shards' blob reports merged into one HTML report, with the failures as annotations on the run.
  e2e-report:
    needs: e2e
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-*
          path: e2e/suite/blob-reports
          merge-multiple: true
      - run: e2e/node_modules/.bin/playwright merge-reports --reporter html,github e2e/suite/blob-reports
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: playwright-report
          retention-days: 14
          if-no-files-found: ignore

  # The required check. It runs whatever happened before it and is red when a needed job failed or was cancelled.
  ci:
    needs: [lanes, check, site, arena, image, e2e, e2e-report]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/gate.sh
        env:
          NEEDS: ${{ toJSON(needs) }}
